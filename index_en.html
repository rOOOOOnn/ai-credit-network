        const revenueCashNeed = totalCashOblig + researchCashCost + workingCapitalCashUse + gpuUsageMaintenanceCash + minCash - begCash - allowedDebt - equityInflow - undrawn * 0.5;
        const marginCashNeed = revenueCashNeed - (p.opex ?? 0) + incrementalCompute - contractualTermDraw;
        const requiredRev = marginOverride === null ? Math.max(0, revenueCashNeed / Math.max(0.1, grossMargin * cashConv))
          : marginOverride > 0 ? Math.max(0, marginCashNeed / marginOverride) : null;

        // Exact Accounting Conservation + Auto-RCF Drawdown
        const preDrawCash = Number((begCash + ocf - capex + allowedDebt + contractualTermDraw + equityInflow - principalRepay - leasePrincipal - gpuMarginCall + refresh.disposalProceeds + investmentSale).toFixed(4));
        let rcfDraw = 0;
        let endCash = preDrawCash;
        let undrawnAfter = undrawn;
        if (preDrawCash < 0 && undrawn > 0) {
          rcfDraw = drawFacilities(e.id, Math.min(-preDrawCash, undrawn));
          endCash = Number((preDrawCash + rcfDraw).toFixed(4));
          undrawnAfter = Number(Math.max(0, undrawn - rcfDraw).toFixed(4));
        }
        const endDebt = Number(Math.max(0, begDebt + allowedDebt + contractualTermDraw + rcfDraw - principalRepay - nonCashDebtConversion).toFixed(4));

        states[e.id] = {
          quarter: q,
          mode: p.mode || "B",
          revenue: projRev,
          requiredRevenue: requiredRev === null ? null : Number(requiredRev.toFixed(2)),
          fcfBreakEvenRevenue,
          minimumRequiredRevenueGrowth,
          priorQuarterRevenue,
          begCash: Number(begCash.toFixed(4)),
          cash: endCash,
          debt: endDebt,
          ocf,
          capex,
          fcf,
          interestExp: interestPaid,
          principalRepay,
          nonCashDebtConversion,
          gpuMarginCall,
          computePay: incrementalCompute,
          operatingCashBridge,
          newDebt: money(allowedDebt + contractualTermDraw),
          contractualTermDraw,
          assumedNewDebt: funding ? fundedScenarioDebt : null,
          financingForecast: funding ? { ...funding, fundedDebt: fundedScenarioDebt, remainingCapacity: financingRemaining[e.id], scheduledEquity: scheduledEq, scheduledEquityStatus, fundedRollover, rcfDraw } : null,
          replacementCapex: refresh.replacementCapex,
          disposalProceeds: refresh.disposalProceeds,
          netGpuReplacementCashOutflow: money(refresh.replacementCapex - refresh.disposalProceeds),
          gpuFleetAgeYears,
          gpuUtilizationRevenueAdjustment,
          gpuUtilizationRate: closingFleetCost > 0 ? gpuUtilization : null,
          openingInvestmentSale: investmentSale,
          openingLiquidityDisclosure: liquidityOpening || null,
          openingFiscalCashFlowDisclosure: fiscalOpening || null,
          laterFiscalDisclosure: useAudit4Contracts && e.audit4LaterFiscalDisclosure?.disclosedDate <= quarterEndDate(q) ? e.audit4LaterFiscalDisclosure : null,
          openingQuarterCashFlow: useAudit4Contracts && q === QUARTER_PARTIAL ? auditCashFlowObservation(e.audit4CashFlowBridge) : null,
          incrementalLeasePayment: leasePayment,
          leaseSchedule,
          recognizedFinanceLease,
          leasePrincipal,
          leaseInterestAdjustment,
          gpuPurchases,
          pledgedGpuValues,
          gpuCollateralValue: fleetOriginalCost > 0 ? money(fleetCollateral) : null,
          gpuAccountingLife: fleetConfig?.accountingLife ?? null,
          gpuPhysicalLife: fleetConfig?.physicalLife ?? null,
          gpuEconomicLife: fleetConfig?.economicLife ?? null,
          rcfDraw,
          equityInflow,
          scenarioEquityIssued,
          scenarioEquityDilution: scenarioEquityDilution === null ? null : money(scenarioEquityDilution),
          cumulativeScenarioEquityDilution: retention === null ? null : money(1 - retention),
          undrawnCredit: undrawnAfter,
          rpo: prev.rpo ?? 0,
          ar: prev.ar !== undefined ? prev.ar : (e.financials?.["2026Q3"]?.ar ?? null),
          minCash,
          grossMargin,
          cashConv,
          dataType: status === "PARTIAL" ? "Partial / Est." : "Forecast",
          insufficientData: false,
          distressLevel: 0,
          distressLabel: "Normal",
          defaultCause: null,
          isSimulatedEvent: false,
          creditLoss: 0,
          equityImpairment: 0,
          lostReceipts: 0,
          arCashHit: 0,
          operationalCostHit: 0,
          operationalRevDelay: 0,
          secondaryFinancingHit: secondaryIntAdd,
          secondaryOpeningSpreadBps: secondarySpreadBpsById[e.id] ?? 0,
          secondaryClosingSpreadBps: secondarySpreadBpsById[e.id] ?? 0,
          secondaryFloatingPrincipal: money(begDebt * floatShare),
          secondaryRefinancingMultiplier: secRefiPenalty,
          inducedCapexCut: 0
        };
      });

      function applyCashDelta(id, ocfDelta, capexDelta = 0) {
        const st = states[id];
        if (!st || isPoolId(id) || st.insufficientData) return;
        st.ocf = Number((st.ocf + ocfDelta).toFixed(4));
        const previousCapex = st.capex;
        st.capex = Number(Math.max(st.replacementCapex ?? 0, st.capex + capexDelta).toFixed(4));
        st.fcf = Number((st.ocf - st.capex).toFixed(4));
        const netDelta = ocfDelta - (st.capex - previousCapex);
        let newCash = Number((st.cash + netDelta).toFixed(4));
        if (newCash < 0 && st.undrawnCredit > 0) {
          const extraDraw = drawFacilities(id, Math.min(-newCash, st.undrawnCredit));
          st.rcfDraw = Number((st.rcfDraw + extraDraw).toFixed(4));
          st.debt = Number((st.debt + extraDraw).toFixed(4));
          st.undrawnCredit = Number(Math.max(0, st.undrawnCredit - extraDraw).toFixed(4));
          newCash = Number((newCash + extraDraw).toFixed(4));
        }
        st.cash = newCash;
      }

      function evaluateDistress(entityId) {
        const e = entityById[entityId];
        const st = states[entityId];
        if (!e || !st || e.isOcean || st.insufficientData) return;
        if (e.lossAbsorbingInvestor) {
          st.distressLevel = st.creditLoss > 5 ? 1 : 0;
          st.distressLabel = st.creditLoss > 5 ? "Level 1: Fund NAV Drawdown" : "Normal";
          st.defaultCause = null;
          st.isSimulatedEvent = false;
          return;
        }
        const mandatoryNextQ = (st.interestExp || 0) + (st.principalRepay || 0) + (st.leasePrincipal ?? 0) + (st.recognizedFinanceLease?.interest ?? 0) + (st.leaseSchedule?.financeInterest ?? 0);
        const totalLiq = (st.cash || 0) + (st.undrawnCredit || 0);

        if (forcedDefaults.has(entityId)) {
          st.distressLevel = 3;
          st.distressLabel = "Level 3: Simulated Default";
          st.defaultCause = "Forced Scenario Default";
          st.isSimulatedEvent = true;
        } else if (totalLiq < 0) {
          st.distressLevel = 3;
          st.distressLabel = "Level 3: Simulated Default";
          st.defaultCause = `Liquidity Exhausted (Cash+RCF=${totalLiq.toFixed(2)}B < 0)`;
          st.isSimulatedEvent = true;
        } else if (totalLiq < mandatoryNextQ && mandatoryNextQ > 0) {
          st.distressLevel = 2;
          st.distressLabel = "Level 2: Liquidity Crisis";
          st.defaultCause = `Debt Service Shortfall (Liq=${totalLiq.toFixed(2)}B < Oblig=${mandatoryNextQ.toFixed(2)}B)`;
          st.isSimulatedEvent = true;
        } else if (st.cash < st.minCash) {
          st.distressLevel = 1;
          st.distressLabel = "Level 1: Liquidity Warning";
          st.defaultCause = null;
          st.isSimulatedEvent = false;
        } else {
          st.distressLevel = 0;
          st.distressLabel = "Normal";
          st.defaultCause = null;
          st.isSimulatedEvent = false;
        }
      }

      if (useAudit4Contracts) {
        for (const entity of entities) {
          const disclosure = entity.audit4GuaranteeDisclosure;
          const state = states[entity.id];
          if (!disclosure || !state || state.insufficientData || disclosure.disclosedDate > quarterEndDate(q)) continue;
          for (const category of disclosure.categories) {
            if (transactions.some(tx => tx.id === category.id)) continue;
            const previouslyCalled = cumCreditLossByTx[category.id] ?? 0;
            const remaining = money(category.maximum - previouslyCalled);
            const requested = nonnegative(overrides[entity.id]?.unallocatedGuaranteeCalls?.[category.id]?.[q]);
            const calledThisQuarter = money(Math.min(remaining, requested));
            const calledGuarantee = money(previouslyCalled + calledThisQuarter);
            cumCreditLossByTx[category.id] = calledGuarantee;
            guaranteeLedger[category.id] = {
              guarantor: entity.id, label: category.label, counterparty: null,
              disclosedMaximum: category.maximum, effectiveExposure: null, contingentExposure: null,
              calledThisQuarter, calledGuarantee, remainingDisclosedCap: money(category.maximum - calledGuarantee),
              sourceUrl: disclosure.sourceUrl, asOf: disclosure.asOf, dataType: "Disclosed cap; assumed calls"
            };
            if (calledThisQuarter <= 0) continue;
            state.cash = money(state.cash - calledThisQuarter);
            state.creditLoss = money(state.creditLoss + calledThisQuarter);
            state.unallocatedGuaranteeCashPaid = money((state.unallocatedGuaranteeCashPaid ?? 0) + calledThisQuarter);
            contagionLog.push({ hop: 0, layer: "L1_FINANCIAL", from: null, to: entity.id, txId: category.id,
              channel: "Assumed cash call on unallocated guarantee", impactB: calledThisQuarter });
          }
        }
      }
      entities.forEach(e => evaluateDistress(e.id));

      // Step 2B: Dynamic Multi-Hop 4-Layer Contagion (strictly on activeTxs!)
      const propagatedDefaults = new Set();
      const propagatedCrisisCuts = new Set();
      const secondaryHitPeersThisQ = new Set();
      const cloudRevLossThisQ = {};
      const directHwCutByCloudThisQ = {};

      for (let hop = 1; hop <= 5; hop++) {
        const newDefaulters = entities
          .map(e => e.id)
          .filter(id => !isPoolId(id) && !entityById[id].lossAbsorbingInvestor && states[id].distressLevel === 3 && !propagatedDefaults.has(id));

        const newCrisisBuyers = entities
          .map(e => e.id)
          .filter(id => !isPoolId(id) && !entityById[id].lossAbsorbingInvestor && states[id].distressLevel === 2 && !propagatedCrisisCuts.has(id));

        if (newDefaulters.length === 0 && newCrisisBuyers.length === 0) break;

        // Layer 2 (Commercial): L2 Crisis Defensive Hardware Cut
        newCrisisBuyers.forEach(buyerId => {
          propagatedCrisisCuts.add(buyerId);
          activeTxs.forEach(tx => {
            if (tx.payer === buyerId && tx.type === "GPU / Server Purchase") {
              const supId = tx.receiver;
              if (isPoolId(supId) || !states[supId] || states[supId].insufficientData) return;
              const qPay = tx.quarterlyPayment || (tx.totalCommitment ? tx.totalCommitment / 16 : 0);
              const cut = Number((qPay * crisisCapExCut).toFixed(4));
              if (cut > 0) {
                const sup = states[supId];
                sup.lostReceipts = Number((sup.lostReceipts + cut).toFixed(4));
                sup.revenue = Number(Math.max(0, sup.revenue - cut).toFixed(4));
                applyCashDelta(supId, -(cut * sup.grossMargin * sup.cashConv), 0);
                directHwCutByCloudThisQ[buyerId] = (directHwCutByCloudThisQ[buyerId] || 0) + cut;
                evaluateDistress(supId);
                contagionLog.push({ hop, layer: "L2_COMMERCIAL", from: buyerId, to: supId, txId: tx.id, channel: `L2 Commercial: Crisis Hardware Cut (-${Math.round(crisisCapExCut * 100)}%)`, impactB: cut });
              }
            }
          });
        });

        // Level 3 Defaults across Layers 1, 2, 3, and 4
        newDefaulters.forEach(defId => {
          propagatedDefaults.add(defId);

          activeTxs.forEach(tx => {
            // Layer 2 (Commercial) + Layer 1 (AR Bad-Debt): Defaulter is PAYER (Customer Defaults -> Supplier Loses Revenue & AR)
            if (tx.payer === defId && OPERATIONAL_TX_TYPES.includes(tx.type)) {
              const supId = tx.receiver;
              if (isPoolId(supId) || !states[supId] || states[supId].insufficientData) return;
              const qPay = tx.quarterlyPayment || (tx.totalCommitment ? tx.totalCommitment / 20 : 0);
              const sup = states[supId];
              const supBaseRev = (entityById[supId]?.financials?.["2026Q3"]?.revenue) || (sup.revenue + 1);
              const macroScale = Math.min(1.0, Math.max(0.25, sup.revenue / Math.max(1, supBaseRev)));
              const loss = Number(Math.min(sup.revenue * 0.45, qPay * defaultHaircut * macroScale).toFixed(4));
              if (loss > 0) {
                sup.lostReceipts = Number((sup.lostReceipts + loss).toFixed(4));
                sup.revenue = Number(Math.max(0, sup.revenue - loss).toFixed(4));
                applyCashDelta(supId, -(loss * sup.grossMargin * sup.cashConv), 0);
                if (entityById[supId]?.isCloudOrNeocloud) {
                  cloudRevLossThisQ[supId] = (cloudRevLossThisQ[supId] || 0) + loss;
                }
                if (tx.type === "GPU / Server Purchase") {
                  directHwCutByCloudThisQ[defId] = (directHwCutByCloudThisQ[defId] || 0) + loss;
                }
                // Layer 1 (Direct Financial): One-Time AR Bad-Debt Write-Off with AR balance decrement
                const arKey = `${defId}->${supId}`;
                if (entityById[supId]?.isHardwareSupplier && !arWrittenOffPairs.has(arKey)) {
                  arWrittenOffPairs.add(arKey);
                  const baseAr = sup.ar || (sup.revenue * 0.45);
                  const share = Math.min(0.25, Math.max(0.03, qPay / Math.max(1, sup.revenue + loss)));
                  const arHit = Number((baseAr * share * lgd).toFixed(4));
                  if (arHit > 0) {
                    sup.arCashHit = Number((sup.arCashHit + arHit).toFixed(4));
                    if (sup.ar !== null) sup.ar = Number(Math.max(0, sup.ar - arHit).toFixed(4));
                    applyCashDelta(supId, -arHit, 0);
                    contagionLog.push({ hop, layer: "L1_FINANCIAL", from: defId, to: supId, txId: tx.id, channel: `L1 Direct Financial: AR Bad-Debt Write-Off`, impactB: arHit });
                  }
                }
                evaluateDistress(supId);
                contagionLog.push({ hop, layer: "L2_COMMERCIAL", from: defId, to: supId, txId: tx.id, channel: `L2 Commercial: ${tx.type} Cut (-${Math.round(defaultHaircut * 100)}%)`, impactB: loss });
              }
            }

            // P0-4 Layer 3 (Operational Contagion): Defaulter is RECEIVER (Supplier/OEM/Cooling/DC/Power Defaults -> Downstream Customer!)
            // Covers ALL 7 service categories, including undisclosed-value contracts via operationalExposureShare
            if (tx.receiver === defId && OPERATIONAL_TX_TYPES.includes(tx.type)) {
              const custId = tx.payer;
              if (isPoolId(custId) || !states[custId] || states[custId].insufficientData) return;
              const cust = states[custId];
              const opCat = tx.operationalCategory || tx.type;
              const subAvail = tx.substitutionAvailability ?? 0.60;
              const switchWks = tx.switchingTimeWeeks ?? 12;
              const costPrem = tx.replacementCostPremium ?? 0.25;
              const disruptionMult = tx.disruptionMode === "FULL" ? 1.0 : 0.70;
              const friction = Math.max(0.05, 1 - subAvail);

              // Anchor operational exposure: disclosed quarterlyPayment if > 0; else operationalExposureShare * customer CapEx/Rev
              const qPay = tx.quarterlyPayment || (tx.totalCommitment ? tx.totalCommitment / 20 : 0);
              const opBase = qPay > 0
                ? qPay
                : Number(Math.max(0.05, ((cust.capex > 0 ? cust.capex : cust.revenue * 0.25) || 0.5) * (tx.operationalExposureShare || 0.04)).toFixed(4));

              if (operationalStartQByTx[tx.id] === undefined) {
                operationalStartQByTx[tx.id] = stepIdx;
              }

              // One-time migration / switching cost cash outflow (strictly L3_OPERATIONAL, never double-counted with L1)
              const migKey = `${defId}->${custId}:${tx.id}`;
              if (opBase > 0 && !operationalMigPairs.has(migKey)) {
                operationalMigPairs.add(migKey);
                const migCost = Number((opBase * costPrem * friction).toFixed(4));
                if (migCost > 0) {
                  cust.operationalCostHit = Number((cust.operationalCostHit + migCost).toFixed(4));
                  applyCashDelta(custId, -migCost, 0);
                  contagionLog.push({
                    hop, layer: "L3_OPERATIONAL", operationalCategory: opCat,
                    from: defId, to: custId, txId: tx.id,
                    channel: `L3 Operational (${opCat}): Switching/Migration Cost (Sub ${Math.round(subAvail * 100)}%)`,
                    impactB: migCost
                  });
                }
              }

              // Temporary revenue/capacity disruption during switching window (decays 50%/qtr, recovers after switchQuarters)
              const quartersElapsed = stepIdx - operationalStartQByTx[tx.id];
              const switchQuarters = Math.min(4, Math.max(1, Math.ceil(switchWks / 13)));
              if (opBase > 0 && quartersElapsed < switchQuarters) {
                const decay = Math.pow(0.5, quartersElapsed);
                const revDelay = Number((opBase * Math.min(1, switchWks / 13) * friction * 0.45 * disruptionMult * decay).toFixed(4));
                if (revDelay > 0) {
                  const lostCapacityRevenue = money(Math.min(cust.revenue, revDelay));
                  const recoveryRate = Math.min(1, nonnegative(overrides[custId]?.operationalRecoveryRate ?? 0.75));
                  const deferred = money(lostCapacityRevenue * recoveryRate);
                  const cashFactor = cust.grossMargin * cust.cashConv;
                  cust.operationalRevDelay = money(cust.operationalRevDelay + deferred);
                  cust.operationalPermanentRevenueLoss = money((cust.operationalPermanentRevenueLoss ?? 0) + lostCapacityRevenue - deferred);
                  cust.operationalCapacityRevenueImpact = money((cust.operationalCapacityRevenueImpact ?? 0) + lostCapacityRevenue);
                  cust.operationalBaselineRevenue = money((cust.operationalBaselineRevenue ?? cust.revenue) - (lostCapacityRevenue - deferred));
                  cust.revenue = money(cust.revenue - lostCapacityRevenue);
                  applyCashDelta(custId, -lostCapacityRevenue * cashFactor);
                  if (deferred > 0) deferredRevenue.push({
                    txId: tx.id, customer: custId, originated: stepIdx, due: operationalStartQByTx[tx.id] + switchQuarters,
                    amount: deferred, cashFactor
                  });
                  contagionLog.push({
                    hop, layer: "L3_OPERATIONAL", operationalCategory: opCat,
                    from: defId, to: custId, txId: tx.id,
                    channel: `L3 Operational (${opCat}): Capacity/Service Disruption (${switchWks}w switch)`,
                    impactB: revDelay
                  });
                }
              }
              evaluateDistress(custId);
            }

            // P0-3 Layer 1 (Direct Financial): TRUE ONE-TIME Debt Credit Loss using computeTransactionEAD
            if (tx.receiver === defId && DEBT_TX_TYPES.includes(tx.type)) {
              if (defaultedTxIds.has(tx.id)) return;
              const row = financingLedger[tx.id];
              const lenderId = row ? row.lender : tx.payer;
              const eadInfo = row && row.endingOutstanding !== null
                ? computeTransactionEAD({ ...tx, principalOutstanding: row.endingOutstanding,
                    principalAsOfQuarter: q, remainingCommitment: row.isRevolver ? 0 : row.undrawnCommitment },
                    q, { lgd, guaranteeCallRate })
                : computeTransactionEAD(tx, q, { lgd, guaranteeCallRate });
              if (row && row.endingOutstanding !== null) {
                row.defaultExposure = eadInfo.totalEAD;
                row.defaulted = true;
                row.undrawnCommitment = 0;
              }
              const collateralValue = states[defId]?.pledgedGpuValues?.[tx.id];
              const collateralRecovery = collateralValue == null ? null :
                money(Math.min(eadInfo.fundedEAD, collateralValue));
              const cLoss = collateralRecovery == null ? eadInfo.creditLossAtDefault :
                money((eadInfo.totalEAD - collateralRecovery) * eadInfo.lgd);
              if (cLoss > 0 || collateralRecovery > 0) {
                defaultedTxIds.add(tx.id);
                cumCreditLossByTx[tx.id] = cLoss;
                creditEvents.push({
                  defaultEventId: `DEF-${q}-${tx.id}`,
                  quarter: q,
                  txId: tx.id,
                  borrower: defId,
                  lender: lenderId,
                  type: tx.type,
                  fundedEAD: eadInfo.fundedEAD,
                  undrawnEAD: eadInfo.undrawnEAD,
                  guaranteeEAD: 0,
                  totalEAD: eadInfo.totalEAD,
                  lgd: eadInfo.lgd,
                  recognizedLoss: cLoss,
                  collateralRecovery,
                  expectedRecovery: Number((eadInfo.totalEAD - cLoss).toFixed(4)),
                  remainingExposure: 0,
                  eadBasis: eadInfo.eadBasis
                });
                if (states[lenderId]) {
                  states[lenderId].creditLoss = money(states[lenderId].creditLoss + cLoss);
                  evaluateDistress(lenderId);
                }
                contagionLog.push({
                  hop, layer: "L1_FINANCIAL", from: defId, to: lenderId ?? defId, txId: tx.id,
                  channel: `L1 Direct Financial: ${tx.type} Credit Loss (EAD $${eadInfo.totalEAD.toFixed(2)}B with ${Math.round(eadInfo.lgd * 100)}% residual LGD)`,
                  impactB: cLoss
                });
              }
            }

            // P0-5 Layer 1 (Direct Financial): Dynamic Phased Guarantee Call (fires ONCE when active!)
            if (tx.receiver === defId && tx.type === "Loan Guarantee") {
              const scenario = guaranteeLedger[tx.id];
              if (!scenario?.projects && defaultedTxIds.has(tx.id)) return;
              const guarId = tx.payer;
              if (isPoolId(guarId) || !states[guarId] || states[guarId].insufficientData) return;
              const eligibleProjects = scenario?.projects?.filter(project => project.calledGuarantee === 0);
              const exposure = eligibleProjects
                ? money(eligibleProjects.reduce((sum, project) => sum + project.remainingGuaranteeLiability, 0)) : undefined;
              const eadInfo = exposure === undefined
                ? computeTransactionEAD(tx, q, { lgd, guaranteeCallRate })
                : { guaranteeEAD: exposure, totalEAD: exposure, lgd: guaranteeCallRate,
                    creditLossAtDefault: money(exposure * guaranteeCallRate), eadBasis: "Project phase scenario" };
              const callAmt = eligibleProjects
                ? money(Math.min(eadInfo.creditLossAtDefault, Math.max(0, scenario.disclosedMaximum - scenario.calledGuarantee)))
                : eadInfo.creditLossAtDefault;
              if (callAmt > 0) {
                if (eligibleProjects) {
                  const allocation = allocateFunding(Object.fromEntries(eligibleProjects.map(project =>
                    [project.projectIndex, project.remainingGuaranteeLiability])), callAmt);
                  for (const project of eligibleProjects) {
                    project.calledThisQuarter = allocation[project.projectIndex];
                    if (!project.calledThisQuarter) continue;
                    project.calledGuarantee = sbEnergyCalls[project.projectIndex] = project.calledThisQuarter;
                    project.remainingGuaranteeLiability = money(project.effectiveExposure - project.calledGuarantee);
                  }
                  scenario.remainingGuaranteeLiability = money(scenario.projects.reduce((sum, row) =>
                    sum + row.remainingGuaranteeLiability, 0));
                } else {
                  defaultedTxIds.add(tx.id);
                }
                cumCreditLossByTx[tx.id] = money((cumCreditLossByTx[tx.id] ?? 0) + callAmt);
                creditEvents.push({
                  defaultEventId: `GUAR-${q}-${tx.id}`,
                  projectCalls: eligibleProjects?.filter(project => project.calledThisQuarter > 0)
                    .map(project => ({ projectIndex: project.projectIndex, amount: project.calledThisQuarter })) ?? null,
                  quarter: q,
                  txId: tx.id,
                  borrower: defId,
                  lender: guarId,
                  type: tx.type,
                  fundedEAD: 0,
                  undrawnEAD: 0,
                  guaranteeEAD: eadInfo.guaranteeEAD,
                  totalEAD: eadInfo.totalEAD,
                  lgd: eadInfo.lgd,
                  recognizedLoss: callAmt,
                  expectedRecovery: Number((eadInfo.guaranteeEAD - callAmt).toFixed(4)),
                  remainingExposure: 0,
                  eadBasis: eadInfo.eadBasis
                });
                states[guarId].creditLoss = Number((states[guarId].creditLoss + callAmt).toFixed(4));
                applyCashDelta(guarId, -callAmt, 0);
                evaluateDistress(guarId);
                contagionLog.push({
                  hop, layer: "L1_FINANCIAL", from: defId, to: guarId, txId: tx.id,
                  channel: `L1 Direct Financial: Guarantee Call (Active Exposure $${eadInfo.guaranteeEAD.toFixed(2)}B x ${Math.round(eadInfo.lgd * 100)}%)`,
                  impactB: callAmt
                });
              }
            }

            // Layer 1 (Direct Financial): Non-Cash Equity Impairment (One-Time)
            if (tx.receiver === defId && tx.type === "Equity Investment" && !equityImpairedTxIds.has(tx.id)) {
              const invId = tx.payer;
              if (!isPoolId(invId) && states[invId]) {
                const eqAmt = (tx.amountDrawn !== null && tx.amountDrawn !== undefined && tx.amountDrawn > 0) ? tx.amountDrawn : (tx.totalCommitment || 0);
                if (eqAmt > 0) {
                  equityImpairedTxIds.add(tx.id);
                  const imp = Number((eqAmt * 0.80).toFixed(4));
                  states[invId].equityImpairment = Number((states[invId].equityImpairment + imp).toFixed(4));
                  contagionLog.push({ hop, layer: "L1_FINANCIAL", from: defId, to: invId, txId: tx.id, channel: `L1 Direct Financial: Non-Cash Equity Impairment`, impactB: imp });
                }
              }
            }
          });

          // P1-2 Layer 4 (Secondary Market Contagion):
          // Default of a leveraged AI infra/lab/cloud issuer widens secondary spreads for leveraged peers
          // (bounded +100 bps next-quarter refinancing spread, zero double-counting of L1/L2/L3 losses)
          if (enableSecondaryContagion) {
            const defEnt = entityById[defId];
            entities.forEach(peer => {
              if (peer.id === defId || peer.isOcean || peer.lossAbsorbingInvestor) return;
              if (secondaryHitPeersThisQ.has(peer.id)) return;
              const pst = states[peer.id];
              if (!pst || pst.insufficientData || pst.debt <= 1.0) return;
              const comparableType = useAudit4Contracts
                ? Boolean(defEnt.type && peer.type === defEnt.type) : peer.type === defEnt.type;
              const commonSector = useAudit4Contracts && defEnt.sector && peer.sector === defEnt.sector;
              const sameTier = comparableType || commonSector || (peer.isCloudOrNeocloud && defEnt.isCloudOrNeocloud);
              const peerLiq = Math.max(0.5, (pst.cash || 0) + (pst.undrawnCredit || 0));
              const highLeverage = (pst.debt / peerLiq) >= 1.5;
              if (sameTier && highLeverage) {
                secondaryHitPeersThisQ.add(peer.id);
                const priorBps = secondarySpreadBpsById[peer.id] ?? 0;
                const spreadWideningBps = useAudit4Contracts ? Math.min(100, 250 - priorBps) : 100;
                secondarySpreadBpsById[peer.id] = Math.min(250, priorBps + spreadWideningBps);
                pst.secondaryClosingSpreadBps = secondarySpreadBpsById[peer.id];
                const exposedPrincipal = useAudit4Contracts ? pst.secondaryFloatingPrincipal : pst.debt * 0.35;
                const quarterlySpreadCost = money(exposedPrincipal * spreadWideningBps / 40000);
                if (quarterlySpreadCost > 0) {
                  pst.secondaryFinancingHit = Number((pst.secondaryFinancingHit + quarterlySpreadCost).toFixed(4));
                  if (useAudit4Contracts) pst.interestExp = money(pst.interestExp + quarterlySpreadCost);
                  applyCashDelta(peer.id, -quarterlySpreadCost, 0);
                  evaluateDistress(peer.id);
                  contagionLog.push({
                    hop: Math.min(5, hop + 1),
                    layer: "L4_SECONDARY",
                    from: defId,
                    to: peer.id,
                    txId: "L4_SPREAD",
                    channel: `L4 Secondary Contagion: Peer Credit Spread Widening (+${spreadWideningBps} bps)`,
                    impactB: quarterlySpreadCost
                  });
                }
              }
            });
          }
        });

        // Layer 2 (Commercial): Deduplicated Induced Cloud CapEx Contraction -> Upstream Hardware Demand Shock
        const netIncrementalHwShock = Object.entries(cloudRevLossThisQ).reduce((acc, [cloudId, lostRev]) => {
          const cst = states[cloudId];
          if (!cst || cst.insufficientData || lostRev <= 0 || cst.inducedCapexCut > 0) return acc;
          const cut = Number(Math.min(cst.capex * maxCapexCutShare, lostRev * capexElasticity).toFixed(4));
          if (cut > 0) {
            cst.inducedCapexCut = cut;
            applyCashDelta(cloudId, 0, -cut);
            evaluateDistress(cloudId);
            const rawHwPortion = cut * gpuShareOfAiCapex;
            const alreadyDirect = directHwCutByCloudThisQ[cloudId] || 0;
            const netHw = Math.max(0, rawHwPortion - alreadyDirect);
            return acc + netHw;
          }
          return acc;
        }, 0);

        if (netIncrementalHwShock > 0) {
          entities.filter(e => e.isHardwareSupplier && e.hardwareSupplyShare > 0).forEach(hw => {
            const hst = states[hw.id];
            if (!hst || hst.insufficientData) return;
            const revHit = Number((netIncrementalHwShock * hw.hardwareSupplyShare).toFixed(4));
            if (revHit > 0) {
              const prevHwRev = Math.max(1, hst.revenue);
              hst.lostReceipts = Number((hst.lostReceipts + revHit).toFixed(4));
              hst.revenue = Number(Math.max(0, hst.revenue - revHit).toFixed(4));
              applyCashDelta(hw.id, -(revHit * hst.grossMargin * hst.cashConv), 0);

              if (hst.ar && !systemicArHitEntities.has(hw.id) && revHit / prevHwRev >= 0.025) {
                systemicArHitEntities.add(hw.id);
                const arHit = Number((hst.ar * Math.min(0.18, (revHit / prevHwRev) * 0.75) * lgd).toFixed(4));
                if (arHit > 0) {
                  hst.arCashHit = Number((hst.arCashHit + arHit).toFixed(4));
                  hst.ar = Number(Math.max(0, hst.ar - arHit).toFixed(4));
                  applyCashDelta(hw.id, -arHit, 0);
                  contagionLog.push({ hop: Math.min(5, hop + 1), layer: "L1_FINANCIAL", from: "CLOUD_CAPEX_CUT", to: hw.id, txId: "A2_SYS", channel: `L1 Direct Financial: Systemic AR Deterioration (One-Time)`, impactB: arHit });
                }
              }

              const pctHit = revHit / prevHwRev;
              nextQGrowthPenalty[hw.id] = Math.max(-0.25, (nextQGrowthPenalty[hw.id] || 0) - pctHit * 0.85);

              evaluateDistress(hw.id);
              contagionLog.push({ hop: Math.min(5, hop + 1), layer: "L2_COMMERCIAL", from: "CLOUD_CAPEX_CUT", to: hw.id, txId: "A3_CAPEX", channel: `L2 Commercial: Induced Cloud CapEx Cut (Net of A1)`, impactB: revHit });
            }
          });
        }
      }

      const operationalRevenueLedger = deferredRevenue.map(entry => {
        const customer = states[entry.customer];
        const canRecover = entry.due <= stepIdx && customer && !customer.insufficientData;
        const recovered = canRecover ? entry.amount : 0;
        const cashRecovered = money(recovered * entry.cashFactor);
        if (canRecover) {
          customer.operationalRecoveryRevenue = money((customer.operationalRecoveryRevenue ?? 0) + recovered);
          customer.operationalRecoveryCash = money((customer.operationalRecoveryCash ?? 0) + cashRecovered);
          customer.operationalBaselineRevenue ??= customer.revenue;
          customer.revenue = money(customer.revenue + recovered);
          applyCashDelta(entry.customer, recovered * entry.cashFactor);
          evaluateDistress(entry.customer);
          entry.settled = true;
        }
        const due = parseQuarterNumber(QUARTER_PARTIAL) + entry.due;
        return { txId: entry.txId, customer: entry.customer, originQuarter: forwardQs[entry.originated],
          dueQuarter: `${Math.floor(due / 4)}Q${due % 4 + 1}`,
          beginning: entry.originated === stepIdx ? 0 : entry.amount,
          added: entry.originated === stepIdx ? entry.amount : 0,
          recovered, cashRecovered, ending: money(entry.amount - recovered), dataType: "Forecast" };
      });
      deferredRevenue = deferredRevenue.filter(entry => !entry.settled);
      for (const row of Object.values(financingLedger)) {
        if (row.endingOutstanding !== null) facilityBalances[row.txId] = row;
      }
      for (const [id, guarantee] of Object.entries(guaranteeLedger)) {
        guarantee.calledGuarantee = cumCreditLossByTx[id] ?? 0;
        if (!guarantee.projects) guarantee.remainingGuaranteeLiability = money(Math.max(0, guarantee.effectiveExposure - guarantee.calledGuarantee));
      }

      entities.forEach(e => {
        const state = states[e.id];
        if (!state.insufficientData && Number.isFinite(state.cash) && Number.isFinite(state.fcf)) {
          const minimumCash = overrides[e.id]?.minCash ?? e.defaults?.minCash ?? 1;
          const burn = Math.max(0, -state.fcf);
          state.quarterlyCashBurn = burn;
          state.monthlyCashBurn = money(burn / 3);
          state.availableLiquidity = money(Math.max(0, state.cash + (state.undrawnCredit ?? 0)));
          state.requiredFinancing = money(Math.max(0, minimumCash - state.cash - (state.undrawnCredit ?? 0)));
          const newFinancing = (state.newDebt ?? 0) + (state.rcfDraw ?? 0) + (state.equityInflow ?? 0);
          const leaseInterest = (state.recognizedFinanceLease?.interest ?? 0) + (state.leaseSchedule?.financeInterest ?? 0);
          const obligations = (state.principalRepay ?? 0) + (state.interestExp ?? 0) + (state.leasePrincipal ?? 0) + leaseInterest;
          const cashBeforeDebtService = state.ocf + (state.interestExp ?? 0) + leaseInterest;
          state.debtServiceCoverage = obligations > 0 ? money(cashBeforeDebtService / obligations) : null;
          const cashUses = burn + (state.principalRepay ?? 0) + (state.leasePrincipal ?? 0) + (state.gpuMarginCall ?? 0) + (state.unallocatedGuaranteeCashPaid ?? 0);
          state.financingDependency = cashUses > 0 ? money(newFinancing / cashUses) : null;
          state.revenueGrowth = state.priorQuarterRevenue > 0 ? money(state.revenue / state.priorQuarterRevenue - 1) : null;
          state.cashRunwayMonths = burn > 0 ? money(3 * Math.max(0, state.cash - minimumCash) / burn) : null;
          state.fundingGap = money(Math.max(0, minimumCash - state.cash));
          const summary = scenarioSummary[e.id] ??= { defaultQuarter: null, breakEvenQuarter: null };
          if (state.distressLevel === 3) summary.defaultQuarter ??= q;
          if (state.fcf >= 0) summary.breakEvenQuarter ??= q;
        }
        const frag = computeFragilityScore(e, states[e.id], ocean, visibleTxs);
        states[e.id].fragilityScore = frag.score;
        states[e.id].fragilityDrivers = frag.drivers;
      });

      const debtReconciliation = {};
      for (const entity of entities) {
        const state = states[entity.id];
        if (!Number.isFinite(state.debt) || entity.isOcean || state.insufficientData) continue;
        const rows = facilityByBorrower[entity.id] ?? [];
        const namedRevolverPrincipal = money(rows.filter(row => row.isRevolver)
          .reduce((sum, row) => sum + row.endingOutstanding, 0));
        const namedTermPrincipal = money(rows.filter(row => !row.isRevolver)
          .reduce((sum, row) => sum + row.endingOutstanding, 0));
        const unattributedDebt = money(state.debt - namedRevolverPrincipal - namedTermPrincipal);
        debtReconciliation[entity.id] = {
          modeledDebt: state.debt, namedRevolverPrincipal, namedTermPrincipal, unattributedDebt,
          coverage: unattributedDebt < 0 ? "Overallocated: review debt classification"
            : unattributedDebt > 0 ? "Partial instrument coverage" : "Reconciled"
        };
      }
      timeline[q] = { quarter: q, status, entities: states, contagionLog, financingLedger, refinancingOriginations, guaranteeLedger, debtReconciliation, operationalRevenueLedger };
      prevStates = states;
    });

    const parentSpvReconciliation = reconcileParentSpvDebt(entities, transactions);
    return { timeline, allQuarters: [...QUARTERS_HIST, ...forwardQs], scenarioSummary, cumCreditLossByTx, creditEvents, parentSpvReconciliation };
  }

  return {
    QUARTERS_HIST,
    QUARTER_PARTIAL,
    QUARTERS_FORECAST,
    ALL_QUARTERS,
    DEBT_TX_TYPES,
    OPERATIONAL_TX_TYPES,
    quarterEndDate,
    quarterStatus,
    compareQuarter,

    computeFragilityScore,
    computeEntityMetrics,
    financingForecast,

    phasedGuarantee,
    runSimulation
  };
});

  function getFragilityRanking(q) {
    const qData = state.simResult.timeline[q];

      .filter(e => !e.isOcean)
      .map(e => ({
        entity: e,

      }))
      .sort((a, b) => b.score - a.score);
  }

  function recompute() {
    state.simResult = Engine.runSimulation(state.entities, state.transactions, {
      ocean: state.ocean,
      overrides: state.overrides,
      forecastThrough: Math.max(2033, ...Object.values(state.overrides).map(override => {
        const financing = override.financing;
        if (financing?.mode !== "curve") return 2033;
        return (financing.startYear ?? 2027) + (financing.horizon ?? 6) - 1;
      })),
      includeFirstGpuRefresh: true,
      audit4Contracts: true,
      forcedDefaults: Array.from(state.forcedDefaults),
      gpuCollateralHaircut: state.gpuCollateralHaircut
    });
    renderAll();
  }

  function computeInitialPositions(w, h) {
    const cx = w / 2, cy = h / 2;
    const minDim = Math.min(w, h);
    const radii = { 1: minDim * 0.135, 2: minDim * 0.255, 3: minDim * 0.358 };
    const activeTxs = Engine.getVisibleTransactions(state.transactions, state.currentQuarter);
    const conn = Engine.analyzeConnectivity(state.entities, activeTxs);

    const placedAngles = {};

    // Ring 1: Core entities evenly spaced with zero empty gaps
    const r1 = state.entities.filter(e => !e.isOcean && e.ring === 1 && conn.connectedIds.has(e.id));
    r1.forEach((e, idx) => {
      const ang = (2 * Math.PI * idx) / Math.max(1, r1.length) - Math.PI / 2;
      placedAngles[e.id] = ang;
      state.nodePositions[e.id] = { x: cx + radii[1] * Math.cos(ang), y: cy + radii[1] * Math.sin(ang) };
    });

    // Helper: average angle of already-placed neighbors to minimize edge crossings
    function idealAngle(id, fallbackIdx, total) {
      const nbrAngles = [];
      activeTxs.forEach(tx => {
        if (tx.payer === id && placedAngles[tx.receiver] !== undefined) nbrAngles.push(placedAngles[tx.receiver]);
        if (tx.receiver === id && placedAngles[tx.payer] !== undefined) nbrAngles.push(placedAngles[tx.payer]);
      });
      if (nbrAngles.length === 0) return (2 * Math.PI * fallbackIdx) / Math.max(1, total) - Math.PI / 2;
      const sx = nbrAngles.reduce((a, b) => a + Math.cos(b), 0);
      const sy = nbrAngles.reduce((a, b) => a + Math.sin(b), 0);
      return Math.atan2(sy, sx);
    }

    // Ring 2 & Ring 3: evenly space ONLY active connected entities, sorted by ideal partner angle
    [2, 3].forEach(ring => {
      const group = state.entities.filter(e => !e.isOcean && e.ring === ring && conn.connectedIds.has(e.id));
      const scored = group.map((e, i) => ({ e, target: idealAngle(e.id, i, group.length) }))
        .sort((a, b) => a.target - b.target);
      scored.forEach((item, idx) => {
        const ang = (2 * Math.PI * idx) / Math.max(1, scored.length) - Math.PI / 2;
        placedAngles[item.e.id] = ang;
        state.nodePositions[item.e.id] = { x: cx + radii[ring] * Math.cos(ang), y: cy + radii[ring] * Math.sin(ang) };
      });
    });
  }

  function initSvg() {
    const container = document.getElementById("networkContainer");

  }

  function getNeighborhood(selectedId, txs, depth) {
    if (!selectedId) return null;
    const set = new Set([selectedId]);
    let frontier = new Set([selectedId]);
    for (let d = 0; d < depth; d++) {
      const next = new Set();
      txs.forEach(tx => {
        if (frontier.has(tx.payer)) next.add(tx.receiver);
        if (frontier.has(tx.receiver)) next.add(tx.payer);
      });
      next.forEach(id => set.add(id));
      frontier = next;
    }
    return set;
  }

  function renderNetwork() {
    const t = T();
    const cx = width / 2, cy = height / 2;
    const minDim = Math.min(width, height);
    const rOceanInner = minDim * 0.405;
    const rOceanOuter = minDim * 0.445;

    const q = state.currentQuarter;
    const qData = state.simResult.timeline[q];
    let allVisibleTxs = Engine.getVisibleTransactions(state.transactions, q);
    if (state.txTypeFilter !== "ALL") allVisibleTxs = allVisibleTxs.filter(x => x.type === state.txTypeFilter);
    if (state.minAmount > 0) allVisibleTxs = allVisibleTxs.filter(x => (Number(x.totalCommitment) || 0) >= state.minAmount);

    const metrics = Engine.computeEntityMetrics(state.entities, allVisibleTxs, qData.entities);
    const neighbors = getNeighborhood(state.selectedNodeId, allVisibleTxs, state.hopDepth);

    // Unified full connected network: ONLY entities with >= 1 active verified internal link enter the graph
    const connAll = Engine.analyzeConnectivity(state.entities, allVisibleTxs);
    const candidateIds = new Set(connAll.connectedIds);

    let displayTxs = allVisibleTxs.filter(tx => {
      const pOk = tx.payer === "PRIVATE_CREDIT_OCEAN" || candidateIds.has(tx.payer);
      const rOk = tx.receiver === "PRIVATE_CREDIT_OCEAN" || candidateIds.has(tx.receiver);
      return pOk && rOk;
    });

    // Ensure every visible node has a position if timeline moved
    const visibleEntityIds = new Set();
    displayTxs.forEach(tx => {
      if (tx.payer !== "PRIVATE_CREDIT_OCEAN") visibleEntityIds.add(tx.payer);
      if (tx.receiver !== "PRIVATE_CREDIT_OCEAN") visibleEntityIds.add(tx.receiver);
    });
    const missingPos = [...visibleEntityIds].some(id => !state.nodePositions[id]);
    if (missingPos) computeInitialPositions(width, height);

    const viewConn = Engine.analyzeConnectivity(state.entities.filter(e => e.isOcean || visibleEntityIds.has(e.id)), displayTxs);

    // Subtle 3-ring hierarchy guides + outer Private Credit Ocean band
    oceanLayer.selectAll("*").remove();
    [minDim * 0.135, minDim * 0.255, minDim * 0.358].forEach(r => {
      oceanLayer.append("circle").attr("cx", cx).attr("cy", cy).attr("r", r).attr("fill", "none").attr("stroke", "#18202D").attr("stroke-width", 1);
    });

    const oceanArc = d3.arc().innerRadius(rOceanInner).outerRadius(rOceanOuter).startAngle(0).endAngle(2 * Math.PI);
    const oceanSelected = state.selectedNodeId === "PRIVATE_CREDIT_OCEAN";
    oceanLayer.append("path")
      .attr("class", "ocean-band").attr("d", oceanArc()).attr("transform", `translate(${cx},${cy})`)
      .attr("fill", "#2B4C7E").attr("fill-opacity", oceanSelected ? 0.22 : 0.08)
      .attr("stroke", oceanSelected ? "#5B8DEF" : "#1E314A").attr("stroke-width", oceanSelected ? 1.5 : 1)
      .on("click", (event) => { event.stopPropagation(); state.selectedNodeId = "PRIVATE_CREDIT_OCEAN"; renderAll(); });

    oceanLayer.append("text")
      .attr("x", cx).attr("y", cy - rOceanOuter - 8).attr("text-anchor", "middle")
      .attr("fill", oceanSelected ? "#93C5FD" : "#51647E").attr("font-size", "10.5px").attr("letter-spacing", "0.08em")
      .text(t.oceanRimLabel);

    edgeLayer.selectAll("*").remove();
    const pairCounts = {};
    displayTxs.forEach(tx => { const key = [tx.payer, tx.receiver].sort().join("--"); pairCounts[key] = (pairCounts[key] || 0) + 1; });
    const pairIdx = {};
    const tooltip = document.getElementById("tooltip");

    displayTxs.forEach(tx => {
      const isOceanTx = tx.payer === "PRIVATE_CREDIT_OCEAN" || tx.receiver === "PRIVATE_CREDIT_OCEAN";
      let pPos, rPos;
      if (isOceanTx) {
        const companyId = tx.payer === "PRIVATE_CREDIT_OCEAN" ? tx.receiver : tx.payer;
        const cPos = state.nodePositions[companyId];
        if (!cPos) return;
        const theta = Math.atan2(cPos.y - cy, cPos.x - cx);
        const rimPos = { x: cx + rOceanInner * Math.cos(theta), y: cy + rOceanInner * Math.sin(theta) };
        pPos = tx.payer === "PRIVATE_CREDIT_OCEAN" ? rimPos : cPos;
        rPos = tx.receiver === "PRIVATE_CREDIT_OCEAN" ? rimPos : cPos;
        const isRel = !state.selectedNodeId || state.selectedNodeId === companyId || state.selectedNodeId === "PRIVATE_CREDIT_OCEAN";
        edgeLayer.append("circle").attr("cx", rimPos.x).attr("cy", rimPos.y).attr("r", isRel ? 3 : 2).attr("fill", "#5B8DEF").attr("opacity", isRel ? 0.7 : 0.15);
      } else {
        pPos = state.nodePositions[tx.payer]; rPos = state.nodePositions[tx.receiver];
        if (!pPos || !rPos) return;
      }

      const vis = Engine.getEdgeVisual(tx, state.selectedNodeId, q);
      const isDirect = state.selectedNodeId && (tx.payer === state.selectedNodeId || tx.receiver === state.selectedNodeId);
      let strokeColor = "#5E718D", markerId = "url(#arrow-neutral)", opacity = 0.56;
      let sw = Math.max(1.25, Math.min(4.5, 1.1 + Math.log10(1 + (Number(tx.totalCommitment) || 1)) * 1.55));

      if (isDirect) {
        strokeColor = vis.role === "outflow" ? "#D9535F" : "#2EAD76";
        markerId = vis.role === "outflow" ? "url(#arrow-red)" : "url(#arrow-green)";
        opacity = 0.92;
        sw = Math.max(1.8, Math.min(5.4, 1.4 + Math.log10(1 + (Number(tx.totalCommitment) || 1)) * 1.95));
      } else if (state.selectedNodeId) {
        opacity = 0.08; markerId = null;
      } else if (isOceanTx) {
        strokeColor = "#4C6E9E"; markerId = "url(#arrow-ocean)"; opacity = 0.48;
      }

      const key = [tx.payer, tx.receiver].sort().join("--");
      const totalInPair = pairCounts[key] || 1;
      const idx = pairIdx[key] || 0;
      pairIdx[key] = idx + 1;
      const dx = rPos.x - pPos.x, dy = rPos.y - pPos.y, dist = Math.hypot(dx, dy) || 1;
      const curveOffset = isOceanTx ? 0 : (totalInPair > 1 ? ((idx % 2 === 0 ? 1 : -1) * (18 + Math.floor(idx / 2) * 14)) : 10);
      const mx = (pPos.x + rPos.x) / 2 - (dy / dist) * curveOffset;
      const my = (pPos.y + rPos.y) / 2 + (dx / dist) * curveOffset;

      const path = edgeLayer.append("path")
        .attr("class", "edge-path")
        .attr("d", isOceanTx ? `M${pPos.x},${pPos.y} L${rPos.x},${rPos.y}` : `M${pPos.x},${pPos.y} Q${mx},${my} ${rPos.x},${rPos.y}`)
        .attr("fill", "none").attr("stroke", strokeColor).attr("stroke-width", sw)
        .attr("stroke-dasharray", vis.dashArray || null).attr("opacity", opacity).attr("marker-end", markerId);

      path.on("mousemove", (event) => {
        tooltip.classList.remove("hidden");
        tooltip.style.left = (event.clientX + 14) + "px";
        tooltip.style.top = (event.clientY + 14) + "px";
        const pLbl = tx.payer === "PRIVATE_CREDIT_OCEAN" ? t.oceanName : tx.payer;
        const rLbl = tx.receiver === "PRIVATE_CREDIT_OCEAN" ? t.oceanName : tx.receiver;
        tooltip.innerHTML = `
          <div class="font-semibold text-slate-100 mb-1">${pLbl} → ${rLbl}</div>
          <div class="flex justify-between gap-4 text-slate-400"><span>${t.ttType}</span><span class="text-slate-200">${t.txTypes[tx.type] || tx.type}</span></div>
          <div class="flex justify-between gap-4 text-slate-400"><span>${t.ttAmt}</span><span class="mono text-slate-100">${fmtB(tx.totalCommitment)} / ${tx.amountDrawn !== null ? fmtB(tx.amountDrawn) : t.unknown}</span></div>
          <div class="flex justify-between gap-4 text-slate-400"><span>${t.ttStatus}</span><span class="mono text-slate-300">${t.txStatus[vis.lineKind] || vis.lineKind} · ${tx.confidence}</span></div>
        `;
      }).on("mouseleave", () => tooltip.classList.add("hidden"));
    });

    nodeLayer.selectAll("*").remove();
    const visibleEntities = state.entities.filter(e => !e.isOcean && visibleEntityIds.has(e.id));
    const maxVal = Math.max(1, ...visibleEntities.map(e => metrics[e.id][state.sizeMetric] || 0));
    function nodeRadius(e) {
      const val = Math.max(0, metrics[e.id][state.sizeMetric] || 0);
      const norm = Math.sqrt(val / maxVal);
      return e.ring === 1 ? (14 + norm * 14) : (9 + norm * 13);
    }

    const drag = d3.drag().on("drag", (event, d) => { state.nodePositions[d.id] = { x: event.x, y: event.y }; renderNetwork(); });

    visibleEntities.forEach(e => {
      const pos = state.nodePositions[e.id];
      if (!pos) return;
      const st = qData.entities[e.id] || {};
      const r = nodeRadius(e);
      const isSelected = state.selectedNodeId === e.id;
      const isDimmed = state.selectedNodeId && state.selectedNodeId !== "PRIVATE_CREDIT_OCEAN" && neighbors && !neighbors.has(e.id);
      const fill = SECTOR_FILL[e.sector] || "#526075";
      const ringStroke = st.distressLevel === 3 ? "#D9535F" : st.distressLevel === 2 ? "#E07A3D" : st.distressLevel === 1 ? "#D99B38" : isSelected ? "#ECEFF4" : "#0C0F14";

      const g = nodeLayer.append("g").datum(e).attr("transform", `translate(${pos.x},${pos.y})`).attr("opacity", isDimmed ? 0.18 : 1).call(drag);
      const circle = g.append("circle").attr("class", "node-circle").attr("r", isSelected ? r * 1.15 : r)
        .attr("fill", fill).attr("fill-opacity", isSelected ? 0.96 : 0.85)
        .attr("stroke", ringStroke).attr("stroke-width", st.distressLevel >= 2 || isSelected ? 2.5 : 1.5);

      g.append("text").attr("class", "node-label").attr("y", r + 13).attr("text-anchor", "middle")
        .attr("fill", isSelected ? "#FFFFFF" : (e.ring === 1 ? "#E2E8F0" : "#94A3B8"))
        .attr("font-size", isSelected || e.ring === 1 ? "11px" : "10px").attr("font-weight", isSelected || e.ring === 1 ? "500" : "400")
        .text(e.id);

      g.on("mouseenter", (event) => {
        circle.attr("r", r * 1.18);
        tooltip.classList.remove("hidden");
        tooltip.style.left = (event.clientX + 14) + "px";
        tooltip.style.top = (event.clientY + 14) + "px";
        tooltip.innerHTML = `
          <div class="font-semibold text-slate-100">${e.name}</div>
          <div class="text-[10px] text-slate-400 mb-1.5">${t.sectors[e.sector] || e.sector} · ${t.ttFrag} ${st.fragilityScore ?? 0}/100</div>
          <div class="flex justify-between gap-4 text-slate-400"><span>${t.ttRev}</span><span class="mono text-slate-100">${fmtB(st.revenue)}</span></div>
          <div class="flex justify-between gap-4 text-slate-400"><span>${t.ttCash}</span><span class="mono text-[#2EAD76]">${fmtB(st.cash)}</span></div>
          <div class="flex justify-between gap-4 text-slate-400"><span>${t.ttDebt}</span><span class="mono text-slate-200">${fmtB(st.debt)}</span></div>
          <div class="flex justify-between gap-4 text-slate-400"><span>${t.ttState}</span><span class="mono ${st.distressLevel >= 2 ? 'text-[#D9535F]' : 'text-slate-300'}">${t.distress[st.distressLabel] || st.distressLabel || t.distress.Normal}</span></div>
        `;
      }).on("mousemove", (event) => {
        tooltip.style.left = (event.clientX + 14) + "px";
        tooltip.style.top = (event.clientY + 14) + "px";
      }).on("mouseleave", () => {
        circle.attr("r", isSelected ? r * 1.15 : r);
        tooltip.classList.add("hidden");
      }).on("click", (event) => {
        event.stopPropagation(); state.selectedNodeId = e.id; renderAll();
      }).on("dblclick", (event) => {
        event.stopPropagation();
        if (state.pinnedNodes.has(e.id)) state.pinnedNodes.delete(e.id); else state.pinnedNodes.add(e.id);
        renderNetwork();
      });
    });

    const compCount = Math.max(1, viewConn.components.length);
    document.getElementById("viewHintText").textContent = state.selectedNodeId
      ? t.hintExecSel(state.selectedNodeId === "PRIVATE_CREDIT_OCEAN" ? t.oceanName : state.selectedNodeId)
      : t.hintComp(visibleEntities.length, displayTxs.length, compCount);
  }

    wl.querySelectorAll(".wl-row").forEach(btn => btn.addEventListener("click", () => { state.selectedNodeId = btn.getAttribute("data-entity"); renderAll(); }));

    // Populate Unconnected Entities (0 active verified edges in current quarter)

          <span class="text-[10px] text-slate-500 truncate ml-2">${t.sectors[ent.sector] || ent.sector}</span>

    document.getElementById("cntWarn").textContent = w;
    document.getElementById("cntCrisis").textContent = c;
    document.getElementById("cntDefault").textContent = d;

      [result.scenarioEquityDilution, result.cumulativeScenarioEquityDilution]
        .map(value => value == null ? "—" : (100 * value).toFixed(2) + "%").join(" / ") : "";
    const lease = result.leaseSchedule;
    panel.querySelector("[data-lease-result]").textContent = lease?.payment > 0 ?
      t("Incremental lease cash / finance principal / finance interest ($B): ",
        "\u65b0\u589e\u79df\u8d41\u4ed8\u6b3e / \u878d\u8d44\u79df\u8d41\u672c\u91d1 / \u5229\u606f: ") +
      [lease.payment, lease.financePrincipal, lease.financeInterest].map(value => value.toFixed(2)).join(" / ") : "";
    const forecast = panel.querySelector("[data-financing-years]");

      ? { ...selectedConfig, history: entity.verifiedFinancingHistory } : selectedConfig;
    const mode = panel.querySelector("select");
    mode.value = selectedConfig.mode;
    const rows = [];
    const sources = ["equity", "debt", "strategic", "prepayment", "assetBacked", "other"];
    const settingsPanel = panel.querySelector("[data-audit-settings]");
    settingsPanel.replaceChildren();
    function setting(label, value, onChange, choices, clearable = false) {
      const row = document.createElement("label");
      row.className = "block";
      row.textContent = label + " ";
      const control = document.createElement(choices ? "select" : "input");
      control.className = "bg-slate-950 border border-slate-700";
      if (choices) {
        for (const [key, text] of choices) control.add(new Option(text, key));
      } else {
        control.type = "number";
        control.step = "any";
      }
      control.value = value ?? "";
      control.addEventListener("change", () => {
        if (choices || Number.isFinite(control.valueAsNumber) || (clearable && control.value === "")) {
          onChange(choices ? control.value : control.value === "" ? null : control.valueAsNumber);
          recompute();
        }
      });
      row.append(control);
      settingsPanel.append(row);
      return control;
    }
    const settings = () => state.overrides[entity.id] ??= {};
    const assignFunding = (key, value) => { (settings().financing ??= selectedConfig)[key] = value; };
    for (const [key, label, fallback] of [
      ["capacity", t("Total financing limit ($B)", "\u7d2f\u8ba1\u878d\u8d44\u4e0a\u9650（\u5341\u4ebf\u7f8e\u5143）"), 0],
      ["quarterlyLimit", t("Quarterly financing limit ($B)", "\u5b63\u5ea6\u878d\u8d44\u4e0a\u9650（\u5341\u4ebf\u7f8e\u5143）"), 0]
    ]) setting(label, selectedConfig[key] ?? fallback, value => assignFunding(key, Math.max(0, value)));
    if (selectedConfig.mode === "curve") {
      setting(t("Curve", "\u66f2\u7ebf"), selectedConfig.curve ?? "linear", value => assignFunding("curve", value),
        [["linear", t("Linear", "\u7ebf\u6027")], ["exponential", t("Exponential", "\u6307\u6570")],
          ["logistic", t("Logistic", "\u903b\u8f91\u65af\u8482")], ["historical", t("Historical", "\u5386\u53f2\u8d8b\u52bf")]]);
      for (const [key, label, fallback] of [
        ["initialGrowth", t("Initial financing growth", "\u521d\u59cb\u878d\u8d44\u589e\u901f"), 0],
        ["annualDecline", t("Annual decline", "\u5e74\u5ea6\u589e\u901f\u964d\u5e45"), 0.2],
        ["minimumGrowth", t("Minimum growth", "\u6700\u4f4e\u589e\u901f"), 0],
        ["horizon", t("Forecast years", "\u9884\u6d4b\u5e74\u6570"), 6]
      ]) setting(label, selectedConfig[key] ?? fallback, value =>
        assignFunding(key, key === "horizon" ? Math.max(1, Math.min(14, Math.trunc(value))) : value));
      if (selectedConfig.curve !== "historical") {
        for (const source of sources) setting(source + " ($B)", selectedConfig.base?.[source] ?? 0, value => {
          const financing = settings().financing ??= selectedConfig;
          (financing.base ??= {})[source] = Math.max(0, value);
        });
      }
    }
    const operating = state.overrides[entity.id] ?? {};
    setting(t("OCF margin before interest and incremental costs", "\u5229\u606f\u548c\u589e\u91cf\u6210\u672c\u524d\u7684\u7ecf\u8425\u73b0\u91d1\u6d41\u5229\u6da6\u7387"),

    setting(t("Incremental quarterly R&D cash cost ($B)", "\u5b63\u5ea6\u65b0\u589e\u7814\u53d1\u73b0\u91d1\u652f\u51fa\uff08\u5341\u4ebf\u7f8e\u5143\uff09"),
      operating.incrementalResearchCashCost ?? 0, value => { settings().incrementalResearchCashCost = Math.max(0, value); });
    setting(t("Quarterly working capital cash use ($B)", "\u5b63\u5ea6\u8425\u8fd0\u8d44\u91d1\u5360\u7528\uff08\u5341\u4ebf\u7f8e\u5143\uff09"),
      operating.workingCapitalCashUse ?? 0, value => { settings().workingCapitalCashUse = value; });
    setting(t("Scenario equity pre-money valuation ($B)", "\u60c5\u666f\u80a1\u6743\u6295\u524d\u4f30\u503c\uff08\u5341\u4ebf\u7f8e\u5143\uff09"),
      operating.equityPreMoneyValuation, value => { settings().equityPreMoneyValuation = value; }, undefined, true);
    const gpu = state.overrides[entity.id]?.gpuRefresh ?? {};
    for (const [key, label, fallback, min, max] of [
      ["economicLife", t("Economic GPU life (years)", "GPU \u7ecf\u6d4e\u5bff\u547d（\u5e74）"), 5, 3, 7],
      ["physicalLife", t("Physical GPU life (years)", "GPU \u7269\u7406\u5bff\u547d（\u5e74）"), null, 1, 30],
      ["accountingLife", t("Accounting GPU life (years)", "GPU \u6298\u65e7\u5e74\u9650"), null, 1, 30],
      ["replacementRatio", t("Quarterly replacement ratio", "\u5b63\u5ea6\u66f4\u65b0\u6bd4\u4f8b"), 0.25, 0, 1],
      ["residualValue", t("Residual value ratio", "\u6b8b\u503c\u6bd4\u4f8b"), 0.2, 0, 0.6],
      ["physicalResidualValue", t("Physical retirement residual ratio", "\u7269\u7406\u9000\u5f79\u6b8b\u503c\u6bd4\u7387"), 0, 0, 0.6],
      ["utilizationRevenueShare", t("GPU utilization-sensitive revenue share", "GPU\u5229\u7528\u7387\u654f\u611f\u6536\u5165\u5360\u6bd4"), 0, 0, 1],
      ["referenceUtilizationRate", t("Reference GPU utilization ratio", "GPU\u53c2\u8003\u5229\u7528\u7387"), 1, 0.01, 1],
      ["utilizationRate", t("GPU utilization ratio", "GPU\u5229\u7528\u7387"), 1, 0, 1],
      ["annualUsageMaintenanceRate", t("Annual GPU usage maintenance ratio", "GPU\u5e74\u5ea6\u4f7f\u7528\u7ef4\u62a4\u8d39\u7387"), 0, 0, 1],
      ["priceDecline", t("Replacement price decline", "\u66f4\u65b0\u91c7\u8d2d\u4ef7\u683c\u964d\u5e45"), 0, 0, 1]
    ]) {
      const control = setting(label, gpu[key] ?? fallback,
        value => { (settings().gpuRefresh ??= {})[key] = Math.min(max, Math.max(min, value)); });
      control.dataset.gpuSetting = key;
    }
    if (entity.id === "ORCL") setting(t("Lease delay (quarters)", "\u8d77\u79df\u5ef6\u8fdf（\u5b63\u5ea6）"),
      state.overrides[entity.id]?.leaseDelayQuarters ?? 0, value => { settings().leaseDelayQuarters = Math.max(0, Math.trunc(value)); });
    const lastYear = Number(state.simResult.allQuarters.at(-1).slice(0, 4));
    for (let year = 2027; year <= lastYear; year++) {
      const planned = Engine.financingForecast(projectionConfig, year);
      const quarters = state.simResult.allQuarters.filter(q => q.startsWith(String(year)));
      const quartersData = quarters.map(q => state.simResult.timeline[q].entities[entity.id]);
      const received = quartersData.reduce((sum, row) => sum + Object.values(row.financingForecast?.amounts ?? {}).reduce((a,b) => a+b, 0), 0);
      const total = Object.values(planned.amounts).reduce((a,b) => a+b, 0);
      const end = quartersData.at(-1);
      const previous = rows.at(-1);
      const previousRevenue = previous?.annualRevenue;
      const annualRevenue = quartersData.every(row => Number.isFinite(row.revenue))
        ? quartersData.reduce((sum, row) => sum + row.revenue, 0) : null;
      const financingGrowth = previous?.total > 0 ? total / previous.total - 1 : null;
      const revenueGrowth = previousRevenue > 0 && annualRevenue !== null ? annualRevenue / previousRevenue - 1 : null;
      rows.push({year, total, received, end, annualRevenue});
      const tr = forecast.insertRow();
      tr.insertCell().textContent = year;
      for (const source of sources) {
        const cell = tr.insertCell();
        if (selectedConfig.mode === "manual") {
          const input = document.createElement("input");
          input.type = "number"; input.min = "0"; input.step = "any";
          input.className = "w-16 bg-slate-950";
          input.setAttribute("aria-label", year + " " + source);
          input.value = planned.amounts[source] ?? 0;
          input.addEventListener("change", () => {
            if (!input.validity.valid || !Number.isFinite(input.valueAsNumber)) return;
            const settings = state.overrides[entity.id] ??= {};
            const funding = settings.financing ??= selectedConfig;
            ((funding.annual ??= {})[year] ??= {})[source] = input.valueAsNumber;
            recompute();
          });
          cell.append(input);
        } else {
          cell.textContent = planned.amounts[source]?.toFixed(2) ?? "—";
        }
      }
      for (const value of [received, end?.financingForecast?.remainingCapacity, end?.fundingGap]) {
        tr.insertCell().textContent = Number.isFinite(value) ? value.toFixed(2) : "—";
      }
      for (const growth of [financingGrowth, revenueGrowth]) {
        tr.insertCell().textContent = growth === null ? "—" : (growth * 100).toFixed(1) + "%";
      }
    }
    const scale = Math.max(1, ...rows.flatMap(row => [row.total, row.received, row.end?.fundingGap ?? 0]));

      for (const [name, value] of [[t("Planned","\u8ba1\u5212"), row.total], [t("Funded","\u5230\u8d26"),row.received],

        label.className = "block";
        label.textContent = row.year + " " + name + " " + value.toFixed(2) + " ";
        const bar = document.createElement("meter");
        bar.max = scale; bar.value = value;
        label.append(bar); item.append(label);
      }
      chart.append(item);
    }
    const trend = panel.querySelector("[data-financing-trend]");
    const metadata = Engine.financingForecast(projectionConfig, selectedConfig.startYear ?? 2027);
    trend.textContent = selectedConfig.curve === "historical" && selectedConfig.mode === "curve" ?

          history.years.map((year, i) => year + " = $" + history.amounts[i] + "B").join(" / ")),
        metadata.missingHistorySources?.length ?
          t("Insufficient Historical Data", "\u5386\u53f2\u878d\u8d44\u6570\u636e\u4e0d\u8db3") + ": " + metadata.missingHistorySources.join(", ") : ""
      ].filter(Boolean).join(" · ") : "";
    if (selectedConfig.mode === "curve" && selectedConfig.curve === "historical" && entity.financingAnnouncements?.length) {

      trend.append(note);

  function bindFinancingScenario() {
    const panel = document.getElementById("financingScenario");
    panel.querySelector("select").addEventListener("change", event => {
      const settings = state.overrides[panel.dataset.entity] ??= {};
      const config = settings.financing ??= JSON.parse(panel.querySelector("textarea").value).financing;
      config.mode = event.target.value;
      recompute();
    });
    panel.querySelector("button").addEventListener("click", () => {
      const output = panel.querySelector("output");
      try {
        const data = JSON.parse(panel.querySelector("textarea").value);
        if (data.incrementalLeaseTranches != null && !Array.isArray(data.incrementalLeaseTranches)) throw new TypeError("Lease tranches must be an array");
        if (!["manual","curve"].includes(data.financing?.mode)) throw new Error("Expected manual or curve mode");
        const settings = state.overrides[panel.dataset.entity] ??= {};
        settings.financing = data.financing;
        settings.gpuRefresh = data.gpuRefresh;
        settings.includeScheduledEquity = data.includeScheduledEquity;
        settings.leaseDelayQuarters = data.leaseDelayQuarters;
        settings.operationalRecoveryRate = data.operationalRecoveryRate;
        settings.openingInvestmentSaleFraction = data.openingInvestmentSaleFraction;
        settings.includeExistingFinanceLease = data.includeExistingFinanceLease;
        settings.unallocatedGuaranteeCalls = data.unallocatedGuaranteeCalls;
        settings.incrementalLease = data.incrementalLease;
        settings.incrementalLeaseTranches = data.incrementalLeaseTranches;
        recompute();
      } catch (error) {
        output.textContent = error.message;
      }
    });
  }

    document.getElementById("dlTxCsv").addEventListener("click", () => {
      const rows = [["id","payer","receiver","type","status","announcedDate","totalCommitment_B","amountDrawn_B","interestRate","actualLender","spv","confidence","sourceUrl"]];
      state.transactions.forEach(t => rows.push([t.id, t.payer, t.receiver, `"${t.type}"`, t.status, t.announcedDate, t.totalCommitment ?? "", t.amountDrawn ?? "", `"${t.interestRate || ''}"`, `"${t.actualLender || ''}"`, `"${t.spv || ''}"`, t.confidence, t.sourceUrl]));
      triggerDownload("transactions.csv", rows.map(r => r.join(",")).join("\n"), "text/csv;charset=utf-8");
    });
    document.getElementById("dlForecastCsv").addEventListener("click", () => {
      const rows = [["quarter","entityId","revenue_B","cash_B","debt_B","fcf_B","fragilityScore","distressLevel","lostReceipts_B","creditLoss_B"]];
      state.simResult.allQuarters.slice(18).forEach(q => { const qd = state.simResult.timeline[q]; state.entities.forEach(e => { const s = qd.entities[e.id] || {}; rows.push([q, e.id, s.revenue ?? "", s.cash ?? "", s.debt ?? "", s.fcf ?? "", s.fragilityScore ?? 0, s.distressLevel ?? 0, s.lostReceipts ?? 0, s.creditLoss ?? 0]); }); });
      triggerDownload("forecast_contagion_results.csv", rows.map(r => r.join(",")).join("\n"), "text/csv;charset=utf-8");
    });
    document.getElementById("dlAuditLedgerJson").addEventListener("click", () => {
      const quarters = state.simResult.allQuarters.flatMap(quarter => {
        const row = state.simResult.timeline[quarter];
        if (!row.financingLedger) return [];
        const { financingLedger, refinancingOriginations, guaranteeLedger, debtReconciliation, operationalRevenueLedger } = row;
        const operatingCashBridges = Object.fromEntries(Object.entries(row.entities)
          .filter(([, company]) => company.operatingCashBridge)
          .map(([id, company]) => [id, { ...company.operatingCashBridge, endingOCF: company.ocf, endingFCF: company.fcf,
            scenarioEquityIssued: company.scenarioEquityIssued, scenarioEquityDilution: company.scenarioEquityDilution,
            cumulativeScenarioEquityDilution: company.cumulativeScenarioEquityDilution }]));
        return [{ quarter, financingLedger, refinancingOriginations, guaranteeLedger, debtReconciliation,
          operationalRevenueLedger, operatingCashBridges }];
      });
      triggerDownload("audit4_quarterly_credit_ledger.json", JSON.stringify({
        version: state.version,
        currency: "USD billions",
        simulationOptions: {
          audit4Contracts: true, forecastThrough: Number(quarters.at(-1).quarter.slice(0, 4)),
          ocean: state.ocean, overrides: state.overrides, forcedDefaults: [...state.forcedDefaults],
          gpuCollateralHaircut: state.gpuCollateralHaircut
        },
        entities: state.entities, transactions: state.transactions,
        quarters, creditEvents: state.simResult.creditEvents,
        parentSpvReconciliation: state.simResult.parentSpvReconciliation
      }, null, 2), "application/json");
    });
    document.getElementById("dlSnapshotJson").addEventListener("click", () => {
      triggerDownload("ai_credit_network_snapshot.json", JSON.stringify({ version: state.version, exportedAt: new Date().toISOString(), ocean: state.ocean, entities: state.entities, transactions: state.transactions }, null, 2), "application/json");
    });

    window.addEventListener("resize", () => {
      const container = document.getElementById("networkContainer");
      width = container.clientWidth || 800; height = container.clientHeight || 600;
      svg.attr("viewBox", [0, 0, width, height]); renderNetwork();
    });
  }

  window.addEventListener("DOMContentLoaded", () => {
    initSvg();
    bindEvents();
    recompute();
  });
})();
</script>
</body>
</html>
