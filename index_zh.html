      const bar = document.createElement("meter");
      bar.max = scale;
      bar.value = amount;
      item.append(bar);
      chart.append(item);
    }
    for (const row of rows) {
      const item = document.createElement("li");
      for (const [name, value, metric] of [[t("Planned","\u8ba1\u5212"), row.total], [t("Scenario funded","\u60c5\u666f\u5230\u8d26"),row.received], [t("All financing","\u878d\u8d44\u5230\u8d26\u603b\u989d"), row.allFinancing],
        [t("Gap","\u7f3a\u53e3"), row.end?.fundingGap],
        [t("Remaining scenario capacity", "\u5269\u4f59\u60c5\u666f\u878d\u8d44\u989d\u5ea6"), row.end?.financingForecast?.remainingCapacity],
        [t("Closing cash", "\u671f\u672b\u73b0\u91d1"), row.end?.cash, "closingCash"]]) {
        if (!Number.isFinite(value)) continue;
        const label = document.createElement("label");
        label.className = "block";
        label.textContent = row.year + " " + name + " " + value.toFixed(2) + " ";
        const bar = document.createElement("meter");
        if (metric === "closingCash") {
          label.dataset.financingClosingCash = row.year;
          bar.min = -scale;
        }
        bar.max = scale; bar.value = value;
        label.append(bar); item.append(label);
      }
      for (const [name, value] of [
        [t("Financing growth", "\u878d\u8d44\u589e\u901f"), row.financingGrowth],
        [t("Revenue growth", "\u6536\u5165\u589e\u901f"), row.revenueGrowth]
      ]) {
        if (!Number.isFinite(value)) continue;
        const label = document.createElement("label");
        label.className = "block";
        label.textContent = row.year + " " + name + " " + (value * 100).toFixed(1) + "% ";
        const bar = document.createElement("meter");
        bar.min = -growthScale;
        bar.max = growthScale;
        bar.value = value;
        label.append(bar);
        item.append(label);
      }
      chart.append(item);
    }
    const trend = panel.querySelector("[data-financing-trend]");
    trend.textContent = selectedConfig.curve === "historical" && selectedConfig.mode === "curve" ?
      [
        ...Object.entries(metadata.historyBySource ?? {}).map(([source, history]) =>
          t("Actual history used", "\u4f7f\u7528\u7684\u5b9e\u9645\u5386\u53f2\u8bb0\u5f55") + " · " + source + ": " +
          history.years.map((year, i) => year + " = $" + history.amounts[i] + "B").join(" / ") +
          (Number(history.years.at(-1)) < (selectedConfig.startYear ?? 2027) - 1
            ? " (" + t("Latest pre-forecast year lacks complete actuals; projected across the gap",
              "\u9884\u6d4b\u524d\u6700\u8fd1\u4e00\u5e74\u7f3a\u5c11\u5b8c\u6574\u5b9e\u9645\u6570\u636e\uff0c\u5df2\u8de8\u7f3a\u53e3\u5916\u63a8") + ")" : "")),
        metadata.missingHistorySources?.length ?
          t("Insufficient Historical Data", "\u5386\u53f2\u878d\u8d44\u6570\u636e\u4e0d\u8db3") + ": " + metadata.missingHistorySources.join(", ") : ""
      ].filter(Boolean).join(" · ") : "";
    if (selectedConfig.mode === "curve" && selectedConfig.curve === "historical" && entity.financingAnnouncements?.length) {
      const note = document.createElement("span");
      note.textContent = " · " + t("Disclosed events outside the annual series: ", "\u672a\u7eb3\u5165\u5e74\u5ea6\u5e8f\u5217\u7684\u5df2\u62ab\u9732\u4e8b\u9879\uff1a");
      trend.append(note);
      const types = {
        round: t("funding announcement", "\u878d\u8d44\u516c\u544a"),
        committedCapital: t("committed capital", "\u627f\u8bfa\u8d44\u672c"),
        undrawnRevolver: t("undrawn revolver limit", "\u672a\u63d0\u6b3e\u5faa\u73af\u6388\u4fe1\u989d\u5ea6")
      };
      for (const event of entity.financingAnnouncements) {
        const link = document.createElement("a");
        link.textContent = event.date + " $" + event.amount + "B (" + types[event.kind] + ")";
        if (event.sourceUrl?.startsWith("https://")) link.href = event.sourceUrl;
        trend.append(link, " · ");
      }
    }
    for (const facility of entity.audit4Facilities ?? []) {
      if (facility.facilityKind !== "Revolver" || !facility.supersedesFacilityIds?.length) continue;
      const link = document.createElement("a");
      link.dataset.financingFacility = facility.id;
      link.textContent = t("Reported revolving credit availability", "\u62ab\u9732\u7684\u5faa\u73af\u6388\u4fe1\u53ef\u7528\u989d\u5ea6") +
        " $" + facility.remainingCommitment + "B (" + facility.principalAsOfQuarter + "). " +
        t("Scheduled maturity", "\u7ea6\u5b9a\u5230\u671f\u65e5") + " " + facility.maturityDate;
      if (facility.sourceUrl?.startsWith("https://")) link.href = facility.sourceUrl;
      trend.append(document.createElement("br"), link);
    }
    if (entity.id === "CRWV" || entity.id === "SPV_CRWV8") {
      const facility = state.transactions.find(tx => tx.id === "TX26");
      const bounds = facility?.conditionalReconciliationBounds;
      if (bounds?.standaloneCarryingValue) {
        const link = document.createElement("a");
        const range = values => "$" + values.join("–") + "B";
        link.dataset.tx26Bounds = "";
        link.textContent = "DDTL 4.0 · " + bounds.asOf + " · " +
          t("Reported principal", "\u62ab\u9732\u672a\u507f\u672c\u91d1") + " $" + facility.principalOutstanding + "B. " +
          t("Undisclosed exact values. Conditional ranges", "\u786e\u5207\u6570\u503c\u672a\u62ab\u9732\u3002\u6761\u4ef6\u533a\u95f4") + " · " +
          t("Cumulative draws", "\u7d2f\u8ba1\u63d0\u6b3e") + " " + range(bounds.cumulativeDrawdown) + " · " +
          t("Cumulative repayments", "\u7d2f\u8ba1\u507f\u8fd8\u672c\u91d1") + " " + range(bounds.cumulativePrincipalRepaid) + " · " +
          t("Carrying value", "\u8d26\u9762\u4ef7\u503c") + " " + range(bounds.standaloneCarryingValue) + " · " +
          t("Undrawn availability", "\u53ef\u63d0\u6b3e\u989d\u5ea6") + " " + range(bounds.undrawnAvailability);
        if (bounds.filingUrl?.startsWith("https://")) link.href = bounds.filingUrl;
        trend.append(document.createElement("br"), link);
      }
    }
    const consolidated = entity.audit4ConsolidatedEvidence;
    if (consolidated) {
      const link = document.createElement("a");
      link.dataset.consolidatedEvidence = "";
      const segmentRevenue = entity.financials["2026Q3"].revenue;
      const consolidatedDebt = (consolidated.currentDebtAndFinanceLeases + consolidated.noncurrentDebtAndFinanceLeases).toFixed(3);
      link.textContent = consolidated.asOf + " · " + t("Super Intelligence quarterly segment revenue", "\u8d85\u7ea7\u667a\u80fd\u5206\u90e8\u5b63\u5ea6\u6536\u5165") + " $" + segmentRevenue.toFixed(3) + "B. " +
        t("SpaceX consolidated quarterly revenue / cash / debt and finance leases", "SpaceX \u5408\u5e76\u5b63\u5ea6\u6536\u5165\uff0f\u73b0\u91d1\uff0f\u503a\u52a1\u53ca\u878d\u8d44\u79df\u8d41") + " ($B): " + [consolidated.quarterRevenue, consolidated.cashAndEquivalents, consolidatedDebt].join(" / ") +
        ". " + t("Segment cash and debt are scenario assumptions.", "\u5206\u90e8\u73b0\u91d1\u548c\u503a\u52a1\u4e3a\u60c5\u666f\u5047\u8bbe\u3002");
      if (consolidated.sourceUrl?.startsWith("https://")) link.href = consolidated.sourceUrl;
      trend.append(document.createElement("br"), link);
    }
    const round = entity.audit4RoundReconciliation;
    if (round) {
      const verified = Object.values(round.verifiedInvestorPaymentsBySeptemberEnd)
        .concat(Object.values(round.verifiedAdditionalOctoberPayment)).reduce((sum, amount) => sum + amount, 0);
      const note = document.createElement("span");
      note.dataset.roundReconciliation = "";
      note.textContent = t("Round commitment / matched investor payments / settlement evidence gap ($B): ",
        "\u878d\u8d44\u627f\u8bfa / \u5df2\u6838\u5bf9\u6295\u8d44\u65b9\u4ed8\u6b3e / \u4ea4\u5272\u51ed\u8bc1\u7f3a\u53e3\uff08\u5341\u4ebf\u7f8e\u5143\uff09\uff1a") +
        [round.committedCapital, verified, round.committedCapital - verified].join(" / ");
      trend.append(document.createElement("br"), note);
    }
    if (entity.reportedFinancingTranches?.length) {
      trend.append(document.createElement("br"), t(
        "Partial investor-reported financing history ",
        "\u6295\u8d44\u65b9\u62ab\u9732\u7684\u90e8\u5206\u878d\u8d44\u8bb0\u5f55 "));
      for (const event of entity.reportedFinancingTranches) {
        const link = document.createElement("a");
        const period = event.date ?? event.quarter;
        link.dataset.financingTranche = period;
        link.textContent = period + " $" + event.amount + "B (" + event.investor + ")";
        if (event.sourceUrl?.startsWith("https://")) link.href = event.sourceUrl;
        trend.append(" ", link);
      }
    }
  }

  function bindFinancingScenario() {
    const panel = document.getElementById("financingScenario");
    panel.querySelector("select").addEventListener("change", event => {
      const settings = state.overrides[panel.dataset.entity] ??= {};
      const config = settings.financing ??= JSON.parse(panel.querySelector("textarea").value).financing;
      config.mode = event.target.value;
      recompute();
    });
    panel.querySelector("button").addEventListener("click", () => {
      const output = panel.querySelector("output");
      try {
        const data = JSON.parse(panel.querySelector("textarea").value);
        if (data.incrementalLeaseTranches != null && !Array.isArray(data.incrementalLeaseTranches)) throw new TypeError("Lease tranches must be an array");
        if (!["manual","curve"].includes(data.financing?.mode)) throw new Error("Expected manual or curve mode");
        const settings = state.overrides[panel.dataset.entity] ??= {};
        if (panel.dataset.entity === "AVGO") settings.residualSupportScenarios = data.residualSupportScenarios;
        if (panel.dataset.entity === "NVDA") {
          if (data.sbEnergyProjects != null && (!Array.isArray(data.sbEnergyProjects) ||
            data.sbEnergyProjects.some(project => !project || typeof project !== "object" || Array.isArray(project)))) {
            throw new TypeError("SB Energy projects must be an array of project settings");
          }
          settings.sbEnergyProjects = data.sbEnergyProjects;
        }
        settings.financing = data.financing;
        if (data.revGrowth === null) delete settings.revGrowth;
        else if (Number.isFinite(data.revGrowth)) settings.revGrowth = Math.max(-1, data.revGrowth);
        if (Number.isFinite(data.companyCreditSpreadBps)) settings.companyCreditSpreadBps = Math.min(2500, Math.max(0, data.companyCreditSpreadBps));
        settings.facilityDrawdowns = data.facilityDrawdowns;
        if (panel.dataset.entity === "CRWV") {
          settings.facilitySweepCash = data.facilitySweepCash;
          settings.facilitySweepEvents = data.facilitySweepEvents;
        }
        settings.gpuRefresh = data.gpuRefresh;
        settings.includeScheduledEquity = data.includeScheduledEquity;
        if (panel.dataset.entity === "OPENAI") settings.includeObservedRoundReceipt = data.includeObservedRoundReceipt === true;
        settings.leaseDelayQuarters = data.leaseDelayQuarters;
        settings.operationalRecoveryRate = data.operationalRecoveryRate;
        settings.operationalSubstitutionAvailability = data.operationalSubstitutionAvailability;
        settings.operationalRecoveryDelayQuarters = data.operationalRecoveryDelayQuarters;
        settings.operationalRecoveryInstallments = data.operationalRecoveryInstallments;
        settings.openingInvestmentSaleFraction = data.openingInvestmentSaleFraction;
        settings.includeExistingFinanceLease = data.includeExistingFinanceLease;
        settings.unallocatedGuaranteeCalls = data.unallocatedGuaranteeCalls;
        settings.incrementalLease = data.incrementalLease;
        settings.incrementalLeaseTranches = data.incrementalLeaseTranches;
        settings.includeAmazonLeaseBuckets = data.includeAmazonLeaseBuckets === true;
        settings.includeNvidiaLeaseBuckets = data.includeNvidiaLeaseBuckets === true;
        settings.includeOracleCommencedFinanceLease = data.includeOracleCommencedFinanceLease === true;
        settings.disclosedLeaseStressYears = data.disclosedLeaseStressYears;
        settings.disclosedLeaseFinanceShare = data.disclosedLeaseFinanceShare;
        settings.disclosedLeaseFinanceRate = data.disclosedLeaseFinanceRate;
        recompute();
      } catch (error) {
        output.textContent = error.message;
      }
    });
  }

  function renderDrawer() {
    const t = T();
    const q = state.currentQuarter;
    const qData = state.simResult.timeline[q];
    const ranked = getFragilityRanking(q);
    const activeId = state.selectedNodeId || (ranked[0] ? ranked[0].entity.id : "NVDA");
    const entity = state.entities.find(e => e.id === activeId) || state.entities[0];
    const st = qData.entities[entity.id] || {};
    const visibleTxs = Engine.getVisibleTransactions(state.transactions, q).filter(x => x.payer === entity.id || x.receiver === entity.id);
    const outTotal = visibleTxs.filter(x => x.payer === entity.id).reduce((s, x) => s + (Number(x.totalCommitment) || 0), 0);
    const inTotal = visibleTxs.filter(x => x.receiver === entity.id).reduce((s, x) => s + (Number(x.totalCommitment) || 0), 0);

    document.getElementById("detailName").textContent = entity.isOcean ? t.oceanName : entity.name;
    document.getElementById("detailMeta").textContent = `${t.sectors[entity.sector] || entity.sector} · ${entity.ticker} · ${q}`;

    const badge = document.getElementById("detailDistressBadge");
    badge.textContent = t.distress[st.distressLabel] || t.distress.Normal;
    badge.className = "mono text-[10px] px-2 py-0.5 rounded shrink-0 border " + (
      st.distressLevel === 3 ? "bg-[#241418] text-[#E5737D] border-[#4A2028]"
      : st.distressLevel === 2 ? "bg-[#241B14] text-orange-300 border-[#4A3220]"
      : st.distressLevel === 1 ? "bg-[#231E14] text-[#D99B38] border-[#44371D]"
      : "bg-[#161B24] text-slate-300 border-[#252E3E]"
    );

    document.getElementById("overviewKpis").innerHTML = [
      { label: t.kpiCash, val: fmtB(st.cash), cls: (st.cash ?? 0) < 0 ? "text-[#D9535F]" : "text-slate-100" },
      { label: t.kpiDebt, val: fmtB(st.debt), cls: "text-slate-100" },
      { label: t.kpiFlow, val: `<span class="text-[#D9535F]">${fmtB(outTotal)}</span> / <span class="text-[#2EAD76]">${fmtB(inTotal)}</span>`, cls: "" },
      { label: t.kpiFrag, val: entity.isOcean ? t.nonDefaulting : `${st.fragilityScore ?? 0} / 100`, cls: (st.fragilityScore ?? 0) >= 65 ? "text-[#D9535F]" : "text-slate-100" }
    ].map(k => `<div class="bg-[#151A23] border border-[#1F2633] rounded-md p-2.5"><div class="text-[10px] text-slate-500">${k.label}</div><div class="mono text-xs font-medium mt-1 ${k.cls}">${k.val}</div></div>`).join("");

    const driversBox = document.getElementById("fragilityDriversBox");
    if (st.fragilityDrivers && st.fragilityDrivers.length > 0) {
      driversBox.classList.remove("hidden");
      document.getElementById("fragilityDriversList").innerHTML = st.fragilityDrivers
        .map(d => `<span class="text-[10px] px-2 py-0.5 rounded bg-[#161B24] border border-[#252E3E] text-slate-300">${t.driversMap[d] || d}</span>`).join("");
    } else {
      driversBox.classList.add("hidden");
    }

    document.getElementById("expandHopBtn").textContent = state.hopDepth === 2 ? t.collapse1Hop : t.expand2Hop;
    const defBtn = document.getElementById("toggleDefaultBtn");
    if (entity.isOcean) {
      defBtn.classList.add("hidden");
    } else {
      defBtn.classList.remove("hidden");
      defBtn.textContent = state.forcedDefaults.has(entity.id) ? t.clearDefault : t.simDefault(entity.id);
    }

    const chartQs = ["2026Q1","2026Q2","2026Q3","2026Q4","2027Q1","2027Q2","2027Q3","2027Q4","2028Q1","2028Q2","2028Q3","2028Q4"];
    const cashSeries = chartQs.map(cq => state.simResult.timeline[cq]?.entities[entity.id]?.cash ?? null);
    const debtSeries = chartQs.map(cq => state.simResult.timeline[cq]?.entities[entity.id]?.debt ?? null);
    const ctx = document.getElementById("entityCashChart").getContext("2d");
    if (cashChart) cashChart.destroy();
    cashChart = new Chart(ctx, {
      type: "line",
      data: {
        labels: chartQs,
        datasets: [
          { label: t.chartCash, data: cashSeries, borderColor: "#2EAD76", backgroundColor: "rgba(46,173,118,0.08)", borderWidth: 1.8, tension: 0.25, fill: true, pointRadius: 1.8 },
          { label: t.chartDebt, data: debtSeries, borderColor: "#94A3B8", backgroundColor: "transparent", borderWidth: 1.5, borderDash: [3, 3], tension: 0.25, pointRadius: 1.5 }
        ]
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { labels: { color: "#94A3B8", font: { size: 10 }, boxWidth: 10 } } },
        scales: { x: { ticks: { color: "#64748B", font: { size: 9 } }, grid: { color: "#1A202C" } }, y: { ticks: { color: "#64748B", font: { size: 9 } }, grid: { color: "#1A202C" } } }
      }
    });

    const dt = st.dataType || entity.dataType;
    document.getElementById("finDataTypeBadge").textContent = `${t.dataTypes[dt] || dt} · ${entity.confidence}`;
    const finVals = [st.revenue, st.cash, st.debt, st.ocf, st.capex, st.fcf, st.undrawnCredit, st.rpo, st.interestExp, (st.lostReceipts || 0) + (st.creditLoss || 0)];
    document.getElementById("financialsTable").innerHTML = t.finLabels.map((lbl, i) => `
      <div class="flex justify-between py-2 text-xs"><span class="text-slate-400">${lbl}</span><span class="mono text-slate-200">${fmtB(finVals[i])}</span></div>
    `).join("");

    document.getElementById("txCountBadge").textContent = t.txCount(visibleTxs.length);
    document.getElementById("detailTxList").innerHTML = visibleTxs.length === 0
      ? `<div class="text-slate-500">${t.noTx}</div>`
      : visibleTxs.map(tx => {
          const isOut = tx.payer === entity.id;
          const cp = isOut ? tx.receiver : tx.payer;
          const cpLabel = cp === "PRIVATE_CREDIT_OCEAN" ? t.oceanName : cp;
          return `
            <div class="bg-[#151A23] border border-[#1F2633] border-l-2 ${isOut ? 'border-l-[#D9535F]' : 'border-l-[#2EAD76]'} rounded p-2.5 space-y-1">
              <div class="flex justify-between items-center">
                <span class="font-medium ${isOut ? 'text-[#E5737D]' : 'text-[#48C78E]'}">${isOut ? t.outflowArrow : t.inflowArrow} ${cpLabel}</span>
                <span class="mono text-slate-100 font-medium">${fmtB(tx.totalCommitment)}</span>
              </div>
              <div class="flex justify-between text-[11px] text-slate-400">
                <span>${t.txTypes[tx.type] || tx.type}</span>
                <span class="mono">${t.txStatus[tx.status] || tx.status} · ${tx.confidence}</span>
              </div>
              <div class="text-[10px] text-slate-500 truncate">${t.actualLender}: ${tx.actualLender}</div>
            </div>
          `;
        }).join("");

    const p = Object.assign({}, entity.defaults || {}, state.overrides[entity.id] || {});
    document.getElementById("paramMode").value = p.mode || "B";
    document.getElementById("modeAReqRev").textContent = st.requiredRevenue !== null && st.requiredRevenue !== undefined
      ? `${fmtB(st.requiredRevenue)} ${t.perQtr}` : t.reqRevHint;

    const paramKeys = [["revGrowth",0.01],["grossMargin",0.02],["opex",0.2],["capex",0.5],["computePay",0.5],["interestRate",0.005],["newDebt",0.5],["equityInflow",0.5],["debtRepay",0.2],["minCash",0.5]];
    document.getElementById("paramControls").innerHTML = paramKeys.map(([key, step], i) => `
      <label class="block">
        <span class="text-[10px] text-slate-500 block mb-0.5">${t.paramLabels[i]}</span>
        <input data-param="${key}" type="number" step="${step}" value="${p[key] ?? 0}" class="param-input w-full bg-[#0C0F14] border border-[#252E3E] rounded px-2 py-1 mono text-xs text-slate-100 focus:outline-none">
      </label>
    `).join("");

    renderFinancingScenario(entity, st);
    document.getElementById("detailCoverage").textContent = entity.filingCoverage;
    document.getElementById("detailSourceLink").href = entity.sourceUrl || "#";
    document.getElementById("sourcesList").innerHTML = visibleTxs.map(tx => `
      <div class="flex items-center justify-between gap-2 py-1.5 border-b border-[#1F2633] text-[11px]">
        <span class="text-slate-400 truncate">${tx.id} · ${tx.sourceDoc}</span>
        <a href="${tx.sourceUrl}" target="_blank" rel="noopener noreferrer" class="text-[#5B8DEF] hover:underline shrink-0">${t.srcLink}</a>
      </div>
    `).join("") || `<div class="text-slate-500 text-[11px]">${t.noSrcTx}</div>`;
  }

  function renderHeader() {
    const t = T();
    const q = state.currentQuarter;
    const st = Engine.quarterStatus(q);
    const badge = document.getElementById("quarterHeaderBadge");
    badge.textContent = `${q} · ${t.qStatus[st] || st}`;
    badge.className = "mono text-[11px] px-2 py-0.5 rounded border " + (
      st === "HISTORICAL" ? "bg-[#161B24] text-slate-300 border-[#262F3F]"
      : st === "PARTIAL" ? "bg-[#231E14] text-[#D99B38] border-[#44371D]"
      : "bg-[#141D2E] text-[#7DA7F4] border-[#24385C]"
    );
    document.getElementById("versionBadge").textContent = state.version.split("-")[0];
    document.getElementById("timelineSlider").max = state.simResult.allQuarters.length - 1;
    document.getElementById("timelineSlider").value = state.simResult.allQuarters.indexOf(q);
  }

  function renderAll() {
    applyStaticStrings();
    renderHeader();
    renderNetwork();
    renderLeftPanel();
    renderDrawer();
  }

  function bindEvents() {
    bindFinancingScenario();
    document.getElementById("langZhBtn").addEventListener("click", () => { state.lang = "zh"; renderAll(); });
    document.getElementById("langEnBtn").addEventListener("click", () => { state.lang = "en"; renderAll(); });

    document.getElementById("toggleLeftBtn").addEventListener("click", () => {
      document.getElementById("leftPanel").classList.toggle("hidden");
      setTimeout(() => {
        const container = document.getElementById("networkContainer");
        width = container.clientWidth || 800; height = container.clientHeight || 600;
        svg.attr("viewBox", [0, 0, width, height]); renderNetwork();
      }, 40);
    });



    function syncOceanInputs() {
      document.getElementById("oceanAvail").value = state.ocean.fundingAvailability;
      document.getElementById("oceanAvailVal").textContent = state.ocean.fundingAvailability + "%";
      document.getElementById("oceanRate").value = state.ocean.interestRate;
      document.getElementById("oceanRateVal").textContent = state.ocean.interestRate + "%";
      document.getElementById("oceanRefi").value = state.ocean.refiSuccessRate;
      document.getElementById("oceanRefiVal").textContent = state.ocean.refiSuccessRate + "%";
      document.getElementById("oceanCap").value = state.ocean.maxCapacity;
      document.getElementById("oceanCapVal").textContent = "$" + state.ocean.maxCapacity + "B";
      document.getElementById("oceanTight").value = state.ocean.creditTighteningBps;
      document.getElementById("oceanTightVal").textContent = "+" + state.ocean.creditTighteningBps + " bps";
    }

    document.getElementById("scenarioSelect").addEventListener("change", (e) => {
      const val = e.target.value;
      state.forcedDefaults.clear();
      if (val === "baseline") {
        state.ocean = { fundingAvailability: 100, interestRate: 7.5, refiSuccessRate: 85, maxCapacity: 250, creditTighteningBps: 0 };
        syncOceanInputs(); state.currentQuarter = "2026Q3";
      } else if (val === "highest_risk") {
        const top = getFragilityRanking("2026Q3")[0];
        if (top) { state.forcedDefaults.add(top.entity.id); state.selectedNodeId = top.entity.id; }
        state.currentQuarter = "2027Q2";
      } else if (val === "credit_tightening") {
        state.gpuCollateralHaircut = 0.0;
        state.overrides = {};
        state.ocean = { fundingAvailability: 30, interestRate: 12.0, refiSuccessRate: 40, maxCapacity: 50, creditTighteningBps: 325 };
        syncOceanInputs(); state.currentQuarter = "2027Q4";
      } else if (val === "gpu_haircut") {
        state.gpuCollateralHaircut = 0.40;
        state.overrides = {};
        state.ocean = { fundingAvailability: 70, interestRate: 9.5, refiSuccessRate: 60, maxCapacity: 150, creditTighteningBps: 150 };
        syncOceanInputs(); state.currentQuarter = "2027Q2";
      } else if (val === "rev_shock_50") {
        state.gpuCollateralHaircut = 0.0;
        state.overrides = { NVDA: { revGrowth: -0.50, revDecel: 0 }, CRWV: { revGrowth: -0.50, revDecel: 0 }, ORCL: { revGrowth: -0.35, revDecel: 0 } };
        state.currentQuarter = "2027Q2";
      }
      recompute();
    });

    document.getElementById("toggleAdvBtn").addEventListener("click", () => {
      const open = document.getElementById("advSettingsBody").classList.toggle("hidden");
      document.getElementById("advChevron").textContent = open ? "+" : "−";
    });
    document.getElementById("toggleUnconnBtn").addEventListener("click", () => {
      const open = document.getElementById("unconnList").classList.toggle("hidden");
      document.getElementById("unconnChevron").textContent = open ? "+" : "−";
    });

    document.getElementById("sizeMetricSelect").addEventListener("change", (e) => { state.sizeMetric = e.target.value; renderNetwork(); });
    document.getElementById("txTypeFilter").addEventListener("change", (e) => { state.txTypeFilter = e.target.value; renderNetwork(); });
    document.getElementById("minAmountSlider").addEventListener("input", (e) => { state.minAmount = Number(e.target.value); document.getElementById("minAmountVal").textContent = `$${state.minAmount}B`; renderNetwork(); });
    document.getElementById("hopDepthSelect").addEventListener("change", (e) => { state.hopDepth = Number(e.target.value); renderNetwork(); });
    document.getElementById("resetLayoutBtn").addEventListener("click", () => {
      state.nodePositions = {}; state.pinnedNodes.clear(); computeInitialPositions(width, height);
      svg.transition().duration(260).call(zoomBehavior.transform, d3.zoomIdentity); renderNetwork();
    });

    [["oceanAvail","fundingAvailability"],["oceanRate","interestRate"],["oceanRefi","refiSuccessRate"],["oceanCap","maxCapacity"],["oceanTight","creditTighteningBps"]].forEach(([id, key]) => {
      document.getElementById(id).addEventListener("input", (e) => { state.ocean[key] = Number(e.target.value); syncOceanInputs(); recompute(); });
    });

    document.querySelectorAll(".drawer-tab").forEach(btn => {
      btn.addEventListener("click", () => {
        const target = btn.getAttribute("data-tab");
        document.querySelectorAll(".drawer-tab").forEach(b => {
          const active = b.getAttribute("data-tab") === target;
          b.className = "drawer-tab px-2.5 py-2.5 font-medium border-b-2 " + (active ? "text-slate-100 border-[#5B8DEF]" : "text-slate-500 hover:text-slate-300 border-transparent");
        });
        ["overview","financials","transactions","forecast","sources"].forEach(x => document.getElementById("tab-" + x).classList.toggle("hidden", x !== target));
      });
    });

    document.getElementById("expandHopBtn").addEventListener("click", () => {
      state.hopDepth = state.hopDepth === 1 ? 2 : 1;
      document.getElementById("hopDepthSelect").value = String(state.hopDepth);
      renderAll();
    });

    document.getElementById("toggleDefaultBtn").addEventListener("click", () => {
      const ranked = getFragilityRanking(state.currentQuarter);
      const id = state.selectedNodeId || (ranked[0] ? ranked[0].entity.id : "NVDA");
      if (state.forcedDefaults.has(id)) state.forcedDefaults.delete(id);
      else { state.forcedDefaults.add(id); if (Engine.quarterStatus(state.currentQuarter) === "HISTORICAL") state.currentQuarter = "2027Q1"; }
      recompute();
    });

    document.getElementById("applyParamsBtn").addEventListener("click", () => {
      const ranked = getFragilityRanking(state.currentQuarter);
      const id = state.selectedNodeId || (ranked[0] ? ranked[0].entity.id : "NVDA");
      const ov = { mode: document.getElementById("paramMode").value };
      document.querySelectorAll(".param-input").forEach(inp => { ov[inp.getAttribute("data-param")] = Number(inp.value); });
      state.overrides[id] = ov;
      if (Engine.quarterStatus(state.currentQuarter) === "HISTORICAL") state.currentQuarter = "2027Q1";
      recompute();
    });
    document.getElementById("resetParamsBtn").addEventListener("click", () => {
      const ranked = getFragilityRanking(state.currentQuarter);
      delete state.overrides[state.selectedNodeId || (ranked[0] ? ranked[0].entity.id : "NVDA")];
      recompute();
    });

    document.getElementById("timelineSlider").addEventListener("input", (e) => { state.currentQuarter = state.simResult.allQuarters[Number(e.target.value)]; renderAll(); });
    document.getElementById("stepBackBtn").addEventListener("click", () => { state.currentQuarter = state.simResult.allQuarters[Math.max(0, state.simResult.allQuarters.indexOf(state.currentQuarter) - 1)]; renderAll(); });
    document.getElementById("stepFwdBtn").addEventListener("click", () => { state.currentQuarter = state.simResult.allQuarters[Math.min(state.simResult.allQuarters.length - 1, state.simResult.allQuarters.indexOf(state.currentQuarter) + 1)]; renderAll(); });
    document.getElementById("playTimelineBtn").addEventListener("click", () => {
      if (state.playTimer) { clearInterval(state.playTimer); state.playTimer = null; }
      else {
        state.playTimer = setInterval(() => {
          state.currentQuarter = state.simResult.allQuarters[(state.simResult.allQuarters.indexOf(state.currentQuarter) + 1) % state.simResult.allQuarters.length];
          renderAll();
        }, 900);
      }
      applyStaticStrings();
    });
    document.getElementById("jumpActualBtn").addEventListener("click", () => { state.currentQuarter = "2026Q3"; renderAll(); });
    document.getElementById("jumpPartialBtn").addEventListener("click", () => { state.currentQuarter = "2026Q4"; renderAll(); });
    document.getElementById("jumpForecastBtn").addEventListener("click", () => { state.currentQuarter = "2027Q4"; renderAll(); });

    const dataModal = document.getElementById("dataModal");
    document.getElementById("openDataModalBtn").addEventListener("click", () => dataModal.classList.remove("hidden"));
    document.getElementById("closeDataModalBtn").addEventListener("click", () => dataModal.classList.add("hidden"));

    function triggerDownload(filename, content, mime) {
      const blob = new Blob([content], { type: mime });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a"); a.href = url; a.download = filename; a.click();
      setTimeout(() => URL.revokeObjectURL(url), 500);
    }
    document.getElementById("dlEntitiesCsv").addEventListener("click", () => {
      const qData = state.simResult.timeline[state.currentQuarter];
      const rows = [["id","name","ticker","sector","ring","quarter","revenue_B","cash_B","debt_B","fcf_B","fragilityScore","distressLabel","sourceUrl"]];
      state.entities.forEach(e => { const s = qData.entities[e.id] || {}; rows.push([e.id, `"${e.name}"`, e.ticker, e.sector, e.ring, state.currentQuarter, s.revenue ?? "", s.cash ?? "", s.debt ?? "", s.fcf ?? "", s.fragilityScore ?? 0, `"${s.distressLabel || ''}"`, e.sourceUrl]); });
      triggerDownload(`entities_${state.currentQuarter}.csv`, rows.map(r => r.join(",")).join("\n"), "text/csv;charset=utf-8");
    });
    document.getElementById("dlTxCsv").addEventListener("click", () => {
      const rows = [["id","payer","receiver","type","status","announcedDate","totalCommitment_B","amountDrawn_B","interestRate","actualLender","spv","confidence","sourceUrl"]];
      state.transactions.forEach(t => rows.push([t.id, t.payer, t.receiver, `"${t.type}"`, t.status, t.announcedDate, t.totalCommitment ?? "", t.amountDrawn ?? "", `"${t.interestRate || ''}"`, `"${t.actualLender || ''}"`, `"${t.spv || ''}"`, t.confidence, t.sourceUrl]));
      triggerDownload("transactions.csv", rows.map(r => r.join(",")).join("\n"), "text/csv;charset=utf-8");
    });
    document.getElementById("dlForecastCsv").addEventListener("click", () => {
      const rows = [["quarter","entityId","revenue_B","cash_B","debt_B","fcf_B","fragilityScore","distressLevel","lostReceipts_B","creditLoss_B"]];
      state.simResult.allQuarters.slice(18).forEach(q => { const qd = state.simResult.timeline[q]; state.entities.forEach(e => { const s = qd.entities[e.id] || {}; rows.push([q, e.id, s.revenue ?? "", s.cash ?? "", s.debt ?? "", s.fcf ?? "", s.fragilityScore ?? 0, s.distressLevel ?? 0, s.lostReceipts ?? 0, s.creditLoss ?? 0]); }); });
      triggerDownload("forecast_contagion_results.csv", rows.map(r => r.join(",")).join("\n"), "text/csv;charset=utf-8");
    });
    document.getElementById("dlAuditLedgerJson").addEventListener("click", () => {
      const quarters = state.simResult.allQuarters.flatMap(quarter => {
        const row = state.simResult.timeline[quarter];
        if (!row.financingLedger) return [];
        const { financingLedger, refinancingOriginations, guaranteeLedger, debtReconciliation, operationalRevenueLedger, operationalRecoverySchedule } = row;
        const operatingCashBridges = Object.fromEntries(Object.entries(row.entities)
          .filter(([, company]) => company.operatingCashBridge)
          .map(([id, company]) => [id, { ...company.operatingCashBridge, endingOCF: company.ocf, endingFCF: company.fcf,
            scenarioEquityIssued: company.scenarioEquityIssued, scenarioEquityDilution: company.scenarioEquityDilution,
            cumulativeScenarioEquityDilution: company.cumulativeScenarioEquityDilution }]));
        const financingCashSources = Object.fromEntries(Object.entries(row.entities)
          .filter(([, company]) => company.financingCashSources)
          .map(([id, company]) => [id, { ...company.financingCashSources, total: company.totalFinancingCashInflow }]));
        const leaseCashSchedules = Object.fromEntries(Object.entries(row.entities)
          .filter(([, company]) => company.leaseSchedule)
          .map(([id, company]) => [id, {
            incremental: company.leaseSchedule,
            recognizedFinance: company.recognizedFinanceLease,
            principalCashPaid: company.leasePrincipal,
            incrementalOperatingCashPaid: company.leaseSchedule.ocfCashPayment
          }]));
        const gpuCashSchedules = Object.fromEntries(Object.entries(row.entities)
          .filter(([, company]) => company.gpuClosingCohorts != null || Object.keys(company.gpuMarginByFacility ?? {}).length > 0)
          .map(([id, company]) => [id, {
            closingCohorts: company.gpuClosingCohorts,
            fleetQuantities: company.gpuFleetQuantities,
            purchasesIncludedInBaseCapex: company.gpuPurchases,
            maintenanceCapex: company.gpuMaintenanceCapex,
            replacementCapex: company.replacementCapex,
            disposalProceeds: company.disposalProceeds,
            netBookValueDisposed: company.gpuNetBookValueDisposed,
            bookValueBridge: company.gpuBookValueBridge,
            grossCostBridge: company.gpuGrossCostBridge,
            disposalGainLoss: company.gpuDisposalGainLoss,
            netReplacementCash: company.netGpuReplacementCashOutflow,
            collateralValue: company.gpuCollateralValue,
            pledgedCollateralByFacility: company.pledgedGpuValues,
            marginCall: company.gpuMarginCall,
            marginStressByFacility: company.gpuMarginByFacility
          }]));
        const secondaryCreditSchedules = Object.fromEntries(Object.entries(row.entities)
          .filter(([, company]) => Number.isFinite(company.secondaryOpeningSpreadBps))
          .map(([id, company]) => [id, {
            openingSpreadBps: company.secondaryOpeningSpreadBps,
            closingSpreadBps: company.secondaryClosingSpreadBps,
            floatingPrincipal: company.secondaryFloatingPrincipal,
            refinancingMultiplier: company.secondaryRefinancingMultiplier,
            incrementalInterest: company.secondaryFinancingHit
          }]));
        const liquiditySchedules = Object.fromEntries(Object.entries(row.entities)
          .filter(([, company]) => !company.insufficientData && Number.isFinite(company.cash))
          .map(([id, company]) => [id, {
            beginningCash: company.begCash,
            endingCash: company.cash,
            minimumOperatingCash: company.minCash,
            undrawnCredit: company.undrawnCredit,
            availableLiquidity: company.availableLiquidity,
            fundingGap: company.fundingGap,
            requiredFinancing: company.requiredFinancing,
            requiredRevenue: company.requiredRevenue,
            minimumFcfRevenueGrowth: company.minimumRequiredRevenueGrowth,
            monthlyCashBurn: company.monthlyCashBurn,
            quarterlyCashBurn: company.quarterlyCashBurn,
            cashRunwayMonths: company.cashRunwayMonths,
            financingDependency: company.financingDependency,
            debtServiceCoverage: company.debtServiceCoverage,
            refinancingFactor: company.auditedRefinancingFactor,
            maturingPrincipal: company.auditedRefinancingPrincipalDue,
            fixedCashObligations: company.auditedFixedCashObligations,
            fragilityScore: company.fragilityScore,
            fragilityDrivers: company.fragilityDrivers,
            distressLevel: company.distressLevel,
            defaultCause: company.defaultCause
          }]));
        return [{ quarter, financingLedger, refinancingOriginations, guaranteeLedger, debtReconciliation,
          operationalRevenueLedger, operationalRecoverySchedule, operatingCashBridges, financingCashSources, leaseCashSchedules, gpuCashSchedules,
          contagionEvents: row.contagionLog, secondaryCreditSchedules, liquiditySchedules }];
      });
      triggerDownload("audit4_quarterly_credit_ledger.json", JSON.stringify({
        version: state.version,
        currency: "USD billions",
        scenarioSummary: state.simResult.scenarioSummary,
        simulationOptions: {
          audit4Contracts: true, includeFirstGpuRefresh: true, forecastThrough: Number(quarters.at(-1).quarter.slice(0, 4)),
          ocean: state.ocean, overrides: state.overrides, forcedDefaults: [...state.forcedDefaults],
          gpuCollateralHaircut: state.gpuCollateralHaircut
        },
        entities: state.entities, transactions: state.transactions,
        quarters, creditEvents: state.simResult.creditEvents,
        parentSpvReconciliation: state.simResult.parentSpvReconciliation
      }, null, 2), "application/json");
    });
    document.getElementById("dlSnapshotJson").addEventListener("click", () => {
      triggerDownload("ai_credit_network_snapshot.json", JSON.stringify({ version: state.version, exportedAt: new Date().toISOString(), ocean: state.ocean, entities: state.entities, transactions: state.transactions }, null, 2), "application/json");
    });

    window.addEventListener("resize", () => {
      const container = document.getElementById("networkContainer");
      width = container.clientWidth || 800; height = container.clientHeight || 600;
      svg.attr("viewBox", [0, 0, width, height]); renderNetwork();
    });
  }

  window.addEventListener("DOMContentLoaded", () => {
    initSvg();
    bindEvents();
    recompute();
  });
})();
</script>
</body>
</html>
